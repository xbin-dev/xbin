name: ci
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Keep in step with go.mod's directive: fmt-check runs THIS
          # install's gofmt, and gofmt output differs across versions
          # (1.26 accepts formatting 1.25 rejects — bit two releases).
          go-version: "1.26"
      # js-test and native-check run native tile code in node workers through
      # module hooks (hack/xbn) and compare Intl output in the fixtures: pin a
      # current LTS rather than whatever the runner image ships.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # The containerfs integration suite mounts FUSE filesystems inside
      # unprivileged user namespaces; Ubuntu 24.04 runners gate those behind
      # an AppArmor knob. It also needs xattr/fscap tooling.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: sudo apt-get update && sudo apt-get install -y attr libcap2-bin fuse3 shellcheck
      # Patched gocryptfs + fuse-overlayfs (docker builds) — cached on the
      # build inputs. Fresh checkouts reset mtimes, so guard on existence
      # instead of letting make's timestamp rules rebuild a cache hit.
      - uses: actions/cache@v4
        with:
          path: bin
          key: containerfs-bins-${{ hashFiles('hack/build-gocryptfs.sh', 'hack/gocryptfs-patches/*.patch', 'hack/gofuse-patches/*.patch', 'hack/build-fuse-overlayfs.sh') }}
      - run: '[ -x bin/gocryptfs ] || make gocryptfs'
      - run: '[ -x bin/fuse-overlayfs ] || make fuse-overlayfs'
      # The definition of done (docs/maintenance.md): fmt-check, vet,
      # js-check, shellcheck, pins-offline, test — then the end-to-end suite.
      - run: make check
      - run: make tile-check
      - run: make integration
      # VM sandboxes (D89): KVM for the runner user, the pinned Firecracker,
      # guest kernel and static mkfs.erofs, and QEMU + vhost-device-vsock for
      # emulated VMs (docker builds, cached on their pins), and a small Ubuntu
      # rootfs for the guests (the tests use bash, curl, ip, mkfs.ext4 from
      # it). The suite runs twice: on KVM, then emulated.
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/cache@v4
        with:
          path: |
            bin/firecracker
            bin/vmlinux
            bin/mkfs.erofs
            bin/qemu-system-x86_64
            bin/qemu-bios-microvm.bin
            bin/qemu-pvh.bin
            bin/vhost-device-vsock
          key: vm-assets-${{ hashFiles('hack/fetch-firecracker.sh', 'hack/build-vmkernel.sh', 'hack/vmkernel/xbin.config', 'hack/build-mkfs-erofs.sh', 'hack/build-qemu.sh', 'hack/build-vhost-vsock.sh') }}
      - run: '[ -x bin/firecracker ] || ./hack/fetch-firecracker.sh bin'
      - run: '[ -f bin/vmlinux ] || ./hack/build-vmkernel.sh bin'
      - run: '[ -x bin/mkfs.erofs ] || ./hack/build-mkfs-erofs.sh bin'
      - run: '[ -x bin/qemu-system-x86_64 ] || ./hack/build-qemu.sh bin'
      - run: '[ -x bin/vhost-device-vsock ] || ./hack/build-vhost-vsock.sh bin'
      - run: |
          printf 'FROM docker.io/library/ubuntu:26.04\nRUN apt-get update && apt-get install -y --no-install-recommends bash curl ca-certificates e2fsprogs iproute2 util-linux && rm -rf /var/lib/apt/lists/*\n' | docker build -t xbin-vmtest-rootfs -
          mkdir -p "$RUNNER_TEMP/vmrootfs"
          docker export "$(docker create xbin-vmtest-rootfs)" | tar -C "$RUNNER_TEMP/vmrootfs" -x
          CGO_ENABLED=0 go build -o bin/bx ./cmd/bx
          CGO_ENABLED=0 go build -o bin/xbin-vmagent ./cmd/xbin-vmagent
          XBIN_ROOTFS="$RUNNER_TEMP/vmrootfs" go test -tags=integration -count=1 -v ./internal/vm/
          XBIN_VM_ACCEL=emulate XBIN_ROOTFS="$RUNNER_TEMP/vmrootfs" go test -tags=integration -count=1 -v ./internal/vm/

  # The native client on Linux (native/AGENTS.md): its Swift packages under the
  # Swift the Apple CI's Xcode carries, with 512 KiB test stacks (make
  # swift-test; swiftly, the toolchain cached on the install script's pins),
  # the fixture contract (make native-check), and the iOS CI's own guard —
  # ios.yml's shape, actionlint, shellcheck and the dry runs of
  # native/ios/scripts against fake Apple tools, under bash 5 and macOS's
  # bash 3.2 (ci-local-check.sh). A job of its own: `test` stays as it is.
  # GitHub-hosted only — this workflow runs for pull requests.
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: cache the Swift toolchain
        uses: actions/cache@v6
        with:
          path: ~/.local/share/swiftly
          key: swiftly-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/ios/scripts/ci-linux-swift.sh') }}
      - name: Swift (swiftly)
        run: native/ios/scripts/ci-linux-swift.sh
      - run: make swift-test
      - name: the app's SwiftUI/UIKit code against SDK stubs
        run: make swift-stubcheck
      - run: make native-check
      - run: sudo apt-get update && sudo apt-get install -y shellcheck python3-yaml
      - name: ci-local-check.sh (the iOS CI scripts, also under bash 3.2)
        env:
          CI_LOCAL_BASH32: "1"
          CI_LOCAL_FETCH_ACTIONLINT: "1"
        run: native/ios/scripts/ci-local-check.sh
