<!doctype html>

<html><head><meta charset="utf-8"><style>
  @font-face{font-family:"IBM Plex Sans";src:url("fonts/IBMPlexSans-Bold.woff2") format("woff2");font-weight:700}
  @font-face{font-family:"IBM Plex Sans";src:url("fonts/IBMPlexSans-SemiBold.woff2") format("woff2");font-weight:600}
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;overflow:hidden;background:#16181d;color:#d4d9e0;
    font-family:-apple-system,"Segoe UI",system-ui,sans-serif;position:relative}
  .bg{position:absolute;inset:0;background:
    radial-gradient(900px 420px at 82% -10%,rgba(245,166,35,.14),transparent 60%),
    radial-gradient(#363c45 1.2px,transparent 1.8px);background-size:auto,30px 30px}
  .in{position:relative;padding:74px 84px;height:100%;display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:16px;font:600 30px "IBM Plex Sans";letter-spacing:.05em}
  h1{font:700 76px/1.05 "IBM Plex Sans";letter-spacing:-.025em;margin-top:88px;max-width:900px}
  h1 .a{color:#f5a623}
  .sub{margin-top:26px;font:26px ui-monospace,Menlo,Consolas,monospace;color:#868f9a}
  .sub b{color:#d4d9e0;font-weight:400}
  .foot{margin-top:auto;display:flex;align-items:center;gap:14px;
    font:22px ui-monospace,Menlo,Consolas,monospace;color:#5c6672}
  .foot .pill{border:1px solid #454d59;border-radius:999px;padding:6px 18px;color:#868f9a}
  .foot .url{margin-left:auto;color:#f5a623}
</style></head><body>
  <div class="bg"></div>
  <div class="in">

        <circle cx="11" cy="53" r="2.6" fill="#1b1e24" opacity=".4"/>
      </svg>X/BIN
    </div>
    <h1>The workspace you rewrite <span class="a">from inside.</span></h1>
    <div class="sub"><b>self-hosted</b> · <b>sandboxed</b> · <b>self-modifying</b></div>
    <div class="foot">
      <span class="pill">MIT / Apache-2.0</span>
      <span class="pill">one unprivileged daemon</span>
      <span class="url">xbin.dev</span>
    </div>
  </div>
