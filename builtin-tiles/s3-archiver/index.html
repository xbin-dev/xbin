<!doctype html>
<!-- S3 Archiver settings. Endpoint/region/bucket/prefix save to this tile's
     /config; the access key + secret save straight into its vault (self is admin
     of itself, docs/auth.md). xbind streams component backups to the /archive
     endpoints; this page is only the configuration surface. -->
<html lang="en" data-bx-theme="auto">
<head>
  <meta charset="utf-8">
  <title>S3 Archiver</title>
  <link rel="stylesheet" href="/vendor/theme.css">
  <style>
    /* body.bx: theme.css's type, controls (Save is the primary button) and
       focus ring; tokens only, so the page is right in light and dark (D184). */
    html, body { margin: 0; }
    body.bx { padding: var(--bx-pad); box-sizing: border-box; }
    h3 { margin: 0 0 4px; font: var(--bx-font-micro); letter-spacing: var(--bx-tracking-micro);
         text-transform: uppercase; color: var(--bx-muted); }
    p.hint { margin: 0 0 12px; color: var(--bx-muted); }
    p.hint code { font: var(--bx-font-code); color: var(--bx-text); }
    label { display: block; margin: 8px 0 4px; color: var(--bx-muted); }
    body.bx input { width: 100%; font-family: var(--bx-mono); }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    button { margin-top: 16px; }
    button.ghost { margin-left: 8px; }
    .msg { margin-top: 12px; min-height: var(--bx-text-line); display: flex; gap: 6px; align-items: baseline; }
    .msg.ok { color: var(--bx-ok); }
    .msg.err { color: var(--bx-danger); }
    .creds { margin-top: 8px; padding-top: 12px; border-top: 1px solid var(--bx-border); }
  </style>
</head>
<body class="bx">
  <h3>S3 Archiver</h3>
  <p class="hint">Where component backups are stored. Any S3-compatible endpoint (AWS, MinIO, R2, B2).
    Needs egress: bind its <b>net</b> interface (admin → Interfaces / bind-on-install prompt) —
    <code>net=internet</code> for a public bucket, or a <code>lan:…</code>/provider for a LAN MinIO.</p>

  <label>Endpoint</label>
  <input id="endpoint" placeholder="https://s3.us-east-1.amazonaws.com">
  <div class="row">
    <div><label>Region</label><input id="region" placeholder="us-east-1"></div>
    <div><label>Bucket</label><input id="bucket" placeholder="my-backups"></div>
  </div>
  <label>Prefix (optional)</label>
  <input id="prefix" placeholder="xbin/">

  <div class="creds">
    <label>Access key ID</label>
    <input id="accessKey" autocomplete="off">
    <label>Secret access key <span id="credState" style="color:var(--bx-muted)"></span></label>
    <input id="secretKey" type="password" autocomplete="off" placeholder="•••••• (leave blank to keep)">
  </div>

  <button id="save" class="primary">Save &amp; test</button>
  <button id="test" class="ghost">Test connection</button>
  <div class="msg" id="msg"></div>

  <script type="module">
    import '/vendor/bx-icons.js'; // <bx-icon name> (D184)
    const self = xbin.self;
    const api = (p, o) => xbin.fetch(`/api/${self}${p}`, o);
    const $ = (id) => document.getElementById(id);
    // say(kind, text): the status line — ok and err carry their icon and colour.
    const say = (kind, text) => {
      const msg = $('msg'); msg.className = kind ? `msg ${kind}` : 'msg';
      const icon = kind && document.createElement('bx-icon');
      if (icon) icon.setAttribute('name', kind === 'ok' ? 'ok' : 'error');
      msg.replaceChildren(...(icon ? [icon] : []), text);
    };
    // Vault writes take {"value": …} JSON (docs/auth.md) — a raw body 400s.
    const setSecret = (key, value) => xbin.fetch(`/api/xbin/vault/${self}/${encodeURIComponent(key)}`,
      { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ value }) });

    async function load() {
      try {
        const d = await (await api('/config')).json();
        const c = d.config || {};
        $('endpoint').value = c.endpoint || '';
        $('region').value = c.region || '';
        $('bucket').value = c.bucket || '';
        $('prefix').value = c.prefix || '';
        $('credState').textContent = d.hasCreds ? '· set' : '· not set';
      } catch { /* first load / not admin */ }
    }

    async function save() {
      say('', 'Saving…');
      $('save').disabled = true;
      try {
        const cfgRes = await api('/config', { method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ endpoint: $('endpoint').value.trim(), region: $('region').value.trim(),
            bucket: $('bucket').value.trim(), prefix: $('prefix').value.trim() }) });
        if (!cfgRes.ok) throw new Error((await cfgRes.json().catch(() => ({}))).error || 'save failed');
        if ($('accessKey').value.trim()) {
          const r = await setSecret('accessKey', $('accessKey').value.trim());
          if (!r.ok) throw new Error('could not store access key in the vault');
        }
        if ($('secretKey').value) {
          const r = await setSecret('secretKey', $('secretKey').value);
          if (!r.ok) throw new Error('could not store secret key in the vault');
        }
        $('secretKey').value = '';
        await load();
        await check(); // saving verifies it actually reaches the bucket
      } catch (e) {
        say('err', String(e.message ?? e));
      } finally { $('save').disabled = false; }
    }

    // Ask the backend to hit the bucket with the stored config + creds.
    async function check() {
      say('', 'Checking connection…');
      try {
        const r = await api('/check', { method: 'POST' });
        const d = await r.json().catch(() => ({}));
        if (r.ok) say('ok', `Connected — bucket “${d.bucket}” is reachable.`);
        else say('err', d.error || `Connection failed (${r.status}).`);
      } catch (e) { say('err', 'Connection check failed: ' + (e.message ?? e)); }
    }

    $('save').addEventListener('click', save);
    $('test').addEventListener('click', check);
    load();
  </script>
</body>
</html>
