<!doctype html>
<!-- Prometheus viewer tile. Pure frontend: no backend of its own. It scrapes
     the "/metrics" endpoint of every component bound to its "sources" interface
     (service "prometheus", multi-input — e.g. apps/llm-gw and, soon, the agent),
     parses the Prometheus text format client-side, and renders a live dashboard:
     current values (counters get a per-second rate, gauges are instantaneous)
     plus a small inline sparkline of recent samples. History lives in page
     memory only — nothing persists; polling is every 3s. -->
<html lang="en" data-bx-theme="auto">
<head>
  <meta charset="utf-8">
  <title>Prometheus Viewer</title>
  <link rel="stylesheet" href="/vendor/theme.css">
  <!-- Natural html height: the frame auto-measures documentElement, so the body
       must wrap content (no height:100% — that would collapse the tile). -->
  <style>html, body { margin: 0; }</style>
</head>
<body class="bx">
  <bx-prometheus-viewer></bx-prometheus-viewer>

  <script type="module">
    import { LitElement, html, css, nothing } from 'lit';
    import { scrollCss } from '/vendor/scroll-css.js';
    import '/vendor/bx-icons.js'; // <bx-icon name> (D184)
    // The binding, the scrape, the parser, rate math and formatters live in
    // prom.js, shared with the native view (native.js).
    import { asEndpoints, epLabel, POLL_MS, histKey, scrape, fmtN, fmtRate, rateOf, labelStr } from './prom.js';

    const ENDPOINTS = asEndpoints(window.xbin?.iface('sources'));

    // Inline SVG sparkline from a series' recent values — self-contained, no
    // external requests. Normalized to the window's own min/max.
    function sparkline(hist) {
      const vals = hist.map((h) => h.v).filter(Number.isFinite);
      const W = 84, H = 20, pad = 2;
      if (vals.length < 2) return html`<svg class="spark" width=${W} height=${H} aria-hidden="true"></svg>`;
      let min = Math.min(...vals), max = Math.max(...vals);
      if (max === min) max = min + 1;                         // flat line → centered
      const n = vals.length;
      const pts = vals.map((v, i) => {
        const x = pad + (i / (n - 1)) * (W - 2 * pad);
        const y = H - pad - ((v - min) / (max - min)) * (H - 2 * pad);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');
      return html`
        <svg class="spark" width=${W} height=${H} viewBox="0 0 ${W} ${H}"
             preserveAspectRatio="none" aria-hidden="true">
          <polyline points=${pts} fill="none"
                    stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" />
        </svg>`;
    }

    // ══════════════════════════════ dashboard ════════════════════════════════
    class BxPrometheusViewer extends LitElement {
      static properties = {
        _sources: { state: true },   // parallel to ENDPOINTS: { error, metrics }
        _live: { state: true },      // any source scraped OK on the last tick
      };

      // Base Two (D184): theme.css's tokens only, so the page is right in
      // light and dark. The sparklines draw in the first chart colour (the
      // ANSI order: blue); the live mark is the 8px accent square.
      static styles = [scrollCss, css`
        :host { display: block; font: var(--bx-font); color: var(--bx-text); background: var(--bx-bg); }
        .wrap { padding: var(--bx-pad); box-sizing: border-box; }
        .top { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .top h3 { margin: 0; font: var(--bx-font-micro); letter-spacing: var(--bx-tracking-micro);
                  text-transform: uppercase; color: var(--bx-muted); }
        .top .sp { flex: 1; }
        .live { display: inline-flex; align-items: center; gap: 6px; font: var(--bx-font-meta); color: var(--bx-muted); }
        .dot { box-sizing: border-box; width: 8px; height: 8px; border: 1px solid var(--bx-border-strong); }
        .dot.on { background: var(--bx-accent); border-color: var(--bx-accent); }

        .source { background: var(--bx-panel); border: 1px solid var(--bx-border);
                  border-radius: var(--bx-radius); padding: 8px 12px; margin-bottom: 12px; }
        .shead { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
                 padding-bottom: 8px; border-bottom: 1px solid var(--bx-border); margin-bottom: 8px; }
        .sname { font-weight: 600; }
        .surl { font: var(--bx-font-code); color: var(--bx-muted); overflow: hidden;
                text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
        .serr { display: inline-flex; align-items: center; gap: 4px; color: var(--bx-danger); margin-left: auto; }
        .mono { font-family: var(--bx-mono); }
        .muted { color: var(--bx-muted); }

        .metric { padding: 4px 0; }
        .metric + .metric { border-top: 1px solid var(--bx-border); }
        .mhead { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
        .mname { font: var(--bx-font-code); font-weight: 700; }
        /* a square badge: micro caps, a 1px border; the type in words, not colour */
        .mtype { box-sizing: border-box; height: 20px; display: inline-flex; align-items: center; padding: 0 6px;
                 font: var(--bx-font-micro); letter-spacing: var(--bx-tracking-micro); text-transform: uppercase;
                 border-radius: var(--bx-radius); border: 1px solid var(--bx-border-strong); color: var(--bx-muted); }
        .mhelp { font: var(--bx-font-meta); color: var(--bx-muted); }

        .srow { display: grid; grid-template-columns: 1fr auto auto 84px; align-items: center;
                gap: 12px; padding: 2px 0 2px 12px; font-variant-numeric: tabular-nums; }
        .srow:hover { background: var(--bx-hover); border-radius: var(--bx-radius); }
        .labels { font: var(--bx-font-code); color: var(--bx-muted); overflow: hidden;
                  text-overflow: ellipsis; white-space: nowrap; }
        .val { font: var(--bx-font-code); font-weight: 700; text-align: right; white-space: nowrap; }
        .rate { font: var(--bx-font-code); color: var(--bx-muted); text-align: right;
                white-space: nowrap; min-width: 52px; }
        .spark { display: block; }
        .spark polyline { stroke: var(--bx-term-blue); }

        .empty { max-width: 520px; padding: 4px 2px; }
        .empty .etitle { font: var(--bx-font-title); margin-bottom: 8px; }
        .empty p { color: var(--bx-muted); margin: 0; }
        .empty .mono, .empty b { color: var(--bx-text); }
      `];

      constructor() {
        super();
        this._sources = ENDPOINTS.map(() => null);   // null → not scraped yet
        this._live = false;
        this._hist = new Map();                       // "<i>\0<seriesKey>" → [{t,v}]
      }

      connectedCallback() {
        super.connectedCallback();
        if (!ENDPOINTS.length) return;
        this._poll();
        this._timer = setInterval(() => this._poll(), POLL_MS);
      }
      disconnectedCallback() {
        super.disconnectedCallback();
        clearInterval(this._timer);
      }

      async _poll() {
        const results = await scrape(ENDPOINTS, this._hist);
        if (!this.isConnected) return;
        this._sources = results;
        this._live = results.some((s) => s && !s.error);
      }

      render() {
        if (!ENDPOINTS.length) return this._renderEmpty();
        return html`
          <div class="wrap">
            <div class="top">
              <h3>Prometheus Viewer</h3>
              <span class="sp"></span>
              <span class="live"><span class="dot ${this._live ? 'on' : ''}"></span>
                live · every ${POLL_MS / 1000}s</span>
            </div>
            ${ENDPOINTS.map((ep, i) => this._renderSource(ep, i))}
          </div>`;
      }

      _renderEmpty() {
        return html`
          <div class="wrap">
            <div class="empty">
              <div class="etitle">No Prometheus source bound</div>
              <p>Bind this tile's <b>sources</b> interface to one or more components
                 that export a <span class="mono">prometheus</span> metrics service
                 (e.g. <span class="mono">apps/llm-gw</span>) in the workspace
                 <b>Interfaces</b> tab on the root page. It will then scrape each
                 provider's <span class="mono">/metrics</span> endpoint and chart
                 the series live.</p>
            </div>
          </div>`;
      }

      _renderSource(ep, i) {
        const src = this._sources[i];
        return html`
          <section class="source">
            <div class="shead">
              <span class="sname">${epLabel(ep)}</span>
              <span class="surl mono">${ep.url}</span>
              ${src?.error ? html`<span class="serr"><bx-icon name="error"></bx-icon>${src.error}</span>` : nothing}
            </div>
            ${src == null
              ? html`<div class="muted">scraping…</div>`
              : src.metrics
                ? this._renderMetrics(i, src.metrics)
                : nothing}
          </section>`;
      }

      _renderMetrics(i, metrics) {
        const names = [...metrics.keys()].sort();
        if (!names.length) return html`<div class="muted">no metrics exported</div>`;
        return html`${names.map((name) => {
          const m = metrics.get(name);
          return html`
            <div class="metric">
              <div class="mhead">
                <span class="mname mono">${name}</span>
                <span class="mtype ${m.type}">${m.type}</span>
                ${m.help ? html`<span class="mhelp">${m.help}</span>` : nothing}
              </div>
              ${m.samples.map((s) => this._renderSeries(i, m, s))}
            </div>`;
        })}`;
      }

      _renderSeries(i, m, s) {
        const hist = this._hist.get(histKey(i, s.key)) ?? [];
        const rate = m.type === 'counter' ? rateOf(hist) : null;
        const ls = labelStr(s.labels);
        return html`
          <div class="srow">
            <span class="labels mono">${ls || html`<span class="muted">—</span>`}</span>
            <span class="val mono">${fmtN(s.value)}</span>
            <span class="rate mono">${rate != null
              ? html`<span title="avg per-second rate">${fmtRate(rate)}/s</span>`
              : nothing}</span>
            ${sparkline(hist)}
          </div>`;
      }
    }

    customElements.define('bx-prometheus-viewer', BxPrometheusViewer);
  </script>
</body>
</html>
