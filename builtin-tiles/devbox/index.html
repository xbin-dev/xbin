<!doctype html>
<!-- Devbox UI. Talks only to its own backend (xbin.self is admin of itself):
     manage podman containers + the authorized SSH keys that gate the SSH
     proxy. SSH itself goes through the exposed :2222 ingress port, not here. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Devbox</title>
<link rel="stylesheet" href="/vendor/theme.css">
<style>
  html, body { margin: 0; }
  body { padding: 12px 16px 16px; font: 13px/1.5 system-ui, sans-serif;
         color: var(--bx-text); background: var(--bx-bg, transparent); }
  h3 { margin: 16px 0 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .08em;
       text-transform: uppercase; color: var(--bx-muted); }
  h3:first-of-type { margin-top: 8px; }
  .muted { color: var(--bx-muted); }
  .err { color: var(--bx-red, #e5484d); }
  .ok  { color: var(--bx-green, #43a047); }
  code, .mono { font-family: var(--bx-mono, ui-monospace, monospace); font-size: 12px; }
  table { border-collapse: collapse; width: 100%; }
  td, th { text-align: left; padding: 4px 10px 4px 0; border-top: 1px solid var(--bx-border); }
  th { border-top: none; font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
       color: var(--bx-muted); }
  input { font: inherit; font-size: 12px; padding: 3px 8px; border: 1px solid var(--bx-border);
          border-radius: 5px; background: var(--bx-panel, #fff); color: inherit; }
  input.k { width: 100%; box-sizing: border-box; font-family: var(--bx-mono); font-size: 11px; }
  button { font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 5px; cursor: pointer;
           border: 1px solid var(--bx-border); background: var(--bx-panel-2, #f7f8fa); color: inherit; }
  button.go { background: var(--bx-green, #43a047); color: #fff; border-color: transparent; }
  button.rm { color: var(--bx-red, #e5484d); border-color: color-mix(in srgb, var(--bx-red,#e5484d) 40%, transparent); }
  form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
  .pill { display: inline-block; font-size: 11px; padding: 0 7px; border-radius: 999px;
          background: var(--bx-panel-2, #f6f8fa); border: 1px solid var(--bx-border); }
  .pill.running { color: var(--bx-green, #43a047); }
  .pill.exited  { color: var(--bx-muted); }
  .hint { font-size: 11.5px; color: var(--bx-muted); margin: 2px 0 8px; }
  .banner { border: 1px solid color-mix(in srgb, var(--bx-amber,#f2a71b) 45%, transparent);
            background: color-mix(in srgb, var(--bx-amber,#f2a71b) 12%, transparent);
            color: var(--bx-amber, #b7791f); border-radius: 6px; padding: 7px 10px; font-size: 12px; margin-bottom: 8px; }
</style>
</head>
<body>
  <div id="banner"></div>
  <div class="hint" id="ssh-hint"></div>

  <h3>Containers</h3>
  <table id="containers"><tr><th>name (ssh user)</th><th>image</th><th>state</th><th></th></tr></table>
  <form id="create">
    <input name="name" placeholder="name (→ ssh user)" size="14" required>
    <input name="image" placeholder="image, e.g. docker.io/library/ubuntu:24.04" size="30" required>
    <button class="go" type="submit">create</button>
  </form>

  <h3>Authorized SSH keys</h3>
  <div class="hint">The SSH proxy is <b>default-deny</b> — nobody can connect until you add a public key here.
    Paste the contents of <code>~/.ssh/id_ed25519.pub</code>.</div>
  <table id="keys"><tr><th>type</th><th>fingerprint</th><th>comment</th><th></th></tr></table>
  <form id="addkey">
    <input class="k" name="key" placeholder="ssh-ed25519 AAAA… you@host" required>
    <button class="go" type="submit">add key</button>
  </form>

<script type="module">
  const self = xbin.self;
  const api = async (p, opt) => {
    const r = await xbin.fetch(`/api/${self}${p}`, opt);
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || (await r.text()) || r.status);
    return r.status === 204 ? null : r.json();
  };
  const el = (id) => document.getElementById(id);
  const rows = (table, header) => { table.querySelectorAll('tr:not(:first-child)').forEach((r) => r.remove()); };

  async function refresh() {
    let s;
    try { s = await api('/state'); }
    catch (e) { el('banner').innerHTML = `<span class="err">${e.message ?? e}</span>`; el('banner').className = 'banner'; return; }

    el('banner').className = '';
    el('banner').innerHTML = s.error ? `<div class="banner">${s.error}</div>`
      : (s.podmanVersion ? `<span class="muted">podman ${s.podmanVersion} · storage persisted</span>` : '');
    el('ssh-hint').innerHTML = s.sshError
      ? `<span class="err">ssh proxy: ${s.sshError}</span>`
      : `SSH in with <code>ssh -p&lt;host-port&gt; &lt;name&gt;@&lt;xbin-host&gt;</code> once you've published
         <code>${s.sshPort}</code> to a host port (admin → ingress → services / expose, or
         <code>bx expose ${self} ssh=runtime --listen ${s.sshPort}</code>).`;

    const ct = el('containers');
    rows(ct);
    for (const c of s.containers ?? []) {
      const tr = document.createElement('tr');
      const running = c.state === 'running';
      tr.innerHTML =
        `<td class="mono">${c.name}</td>` +
        `<td class="mono muted">${c.image}</td>` +
        `<td><span class="pill ${running ? 'running' : 'exited'}">${c.status || c.state}</span></td>` +
        `<td style="text-align:right; white-space:nowrap"></td>`;
      const acts = tr.lastElementChild;
      const btn = (label, cls, fn) => { const b = document.createElement('button'); b.textContent = label; if (cls) b.className = cls; b.onclick = fn; acts.appendChild(b); return b; };
      btn(running ? 'stop' : 'start', '', () => act(`/containers/${c.name}/${running ? 'stop' : 'start'}`, 'POST'));
      btn('remove', 'rm', () => { if (confirm(`Remove container ${c.name}? Its filesystem is lost.`)) act(`/containers/${c.name}`, 'DELETE'); });
      ct.appendChild(tr);
    }
    if (!(s.containers ?? []).length) {
      const tr = document.createElement('tr'); tr.innerHTML = `<td class="muted" colspan="4">no containers yet</td>`; ct.appendChild(tr);
    }

    const kt = el('keys');
    rows(kt);
    for (const k of s.keys ?? []) {
      const tr = document.createElement('tr');
      tr.innerHTML =
        `<td>${k.type}</td><td class="mono" style="font-size:11px">${k.fingerprint}</td>` +
        `<td class="muted">${k.comment || ''}</td>` +
        `<td style="text-align:right"><button class="rm">remove</button></td>`;
      tr.querySelector('button').onclick = () => act(`/keys/${encodeURIComponent(k.fingerprint)}`, 'DELETE');
      kt.appendChild(tr);
    }
    if (!(s.keys ?? []).length) {
      const tr = document.createElement('tr'); tr.innerHTML = `<td class="muted" colspan="4">no keys — SSH is closed</td>`; kt.appendChild(tr);
    }
  }

  async function act(path, method, body) {
    try { await api(path, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined }); await refresh(); }
    catch (e) { el('banner').className = 'banner'; el('banner').innerHTML = `<span class="err">${e.message ?? e}</span>`; }
  }

  el('create').addEventListener('submit', (ev) => { ev.preventDefault(); const f = ev.target;
    act('/containers', 'POST', { name: f.name.value.trim(), image: f.image.value.trim() }).then(() => f.reset()); });
  el('addkey').addEventListener('submit', (ev) => { ev.preventDefault(); const f = ev.target;
    act('/keys', 'POST', { key: f.key.value.trim() }).then(() => f.reset()); });

  refresh();
  setInterval(refresh, 5000);
</script>
</body>
</html>
