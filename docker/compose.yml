# buxon — recommended deployment (see README §Deployment).
#
#   1. put a strong passphrase in .env (gitignored):
#        printf 'BUXON_VAULT_PASSPHRASE=%s\n' "$(openssl rand -base64 24)" > .env
#   2. docker compose up -d   &&   docker compose logs   (→ login URL)
#
# All state lives in the bind-mounted ./workspace — a real directory you can
# inspect, git, and back up. Never run without an explicit /workspace mount
# (a bare `docker run` would orphan your data in an anonymous volume).
services:
  buxon:
    image: ghcr.io/magik6k/buxon:latest
    container_name: buxon
    restart: unless-stopped
    ports:
      # Loopback on purpose: put Tailscale/Caddy in front for remote access
      # (README §Deployment). Never raw-expose to the internet.
      - "127.0.0.1:8642:8642"
    volumes:
      # Bind mount (recommended). Swap for a named volume if you prefer:
      #   - buxon-data:/workspace   (and add a top-level `volumes:` block)
      - ${BUXON_WORKSPACE:-./workspace}:/workspace
    environment:
      # Encrypts the vault at rest. Set it in .env for hands-off auto-unseal,
      # or leave it empty to boot with the vault LOCKED and unseal manually
      # after login (`bx vault unseal`) — the stronger mode, passphrase never
      # in the container env. Either way secrets are never stored plaintext
      # (that needs --insecure-vault). Keep any value out of git.
      - BUXON_VAULT_PASSPHRASE=${BUXON_VAULT_PASSPHRASE:-}
    # Reasonable fences for a box whose job is running arbitrary code:
    mem_limit: 4g
    pids_limit: 2048
    # Tier-2 per-scope uids (docs/auth.md §tiers): keep root + add the flag.
    # command: ["--scope-uids"]

# Host sysctl required for large workspaces (bx doctor checks it):
#   sudo sysctl -w fs.inotify.max_user_watches=524288
