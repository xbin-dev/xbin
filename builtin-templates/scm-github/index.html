<!doctype html>
<!-- scm-github: GitHub as an scm provider (API.md). In your own partition
     this page is your GitHub sign-in; at the tile's global instance — where
     the page reaches with {partition: 'global'} — managers set the GitHub
     App up, the policy, and see installations and webhook health. scm.js
     draws it; native.js is the xbin app's view. -->
<html lang="en" data-bx-theme="auto">
<head>
  <meta charset="utf-8">
  <title>GitHub (scm)</title>
  <link rel="stylesheet" href="/vendor/theme.css">
  <style>
    /* body.bx: theme.css's type, controls and focus ring; this sheet uses its
       tokens only, so the page is right in light and dark (D184): micro-caps
       labels, square badges with a status colour, ruled tables, .go the
       primary button, .rm the danger outline. */
    body.bx { margin: 0; background: var(--bx-bg); }
    main { max-width: 780px; margin: 0 auto; padding: var(--bx-pad, 12px) 16px 28px; }
    h3 { margin: 0; font: var(--bx-font-title); display: flex; gap: 8px; align-items: center; }
    h4 { margin: 20px 0 8px; font: var(--bx-font-micro); letter-spacing: var(--bx-tracking-micro); text-transform: uppercase; color: var(--bx-muted); }
    .muted { color: var(--bx-muted); }
    .small { font: var(--bx-font-meta); }
    .err { color: var(--bx-danger); margin: 8px 0; }
    .ok { color: var(--bx-ok); }
    .warn { color: var(--bx-warn); }
    /* a badge: square, 20px, micro caps, a 1px border; a status one in its colour */
    .chip { box-sizing: border-box; display: inline-flex; align-items: center; height: 20px; padding: 0 6px; vertical-align: middle;
      font: var(--bx-font-micro); letter-spacing: var(--bx-tracking-micro); text-transform: uppercase;
      border-radius: var(--bx-radius); border: 1px solid var(--bx-border-strong); color: var(--bx-muted); }
    .chip.warn { color: var(--bx-warn); border-color: var(--bx-warn); }
    .chip.ok { color: var(--bx-ok); border-color: var(--bx-ok); }
    .card { border: 1px solid var(--bx-border); border-radius: var(--bx-radius); padding: 8px 12px; background: var(--bx-panel); margin: 8px 0; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 4px 0; }
    /* a device code, to be read and typed */
    .code { font: 600 22px/1.2 var(--bx-mono); letter-spacing: .12em; padding: 4px 12px; border: 1px solid var(--bx-border-strong);
      border-radius: var(--bx-radius); background: var(--bx-panel-2); }
    code, .mono { font-family: var(--bx-mono); font-size: var(--bx-mono-size, 12px); }
    input, select, textarea { box-sizing: border-box; }
    textarea { width: 100%; min-height: 64px; font: var(--bx-font-code); }
    label { display: flex; flex-direction: column; gap: 4px; font: var(--bx-font-micro); letter-spacing: var(--bx-tracking-micro);
      text-transform: uppercase; color: var(--bx-muted); flex: 1 1 200px; }
    label > input, label > select, label > textarea { font: var(--bx-font); letter-spacing: normal; text-transform: none; color: var(--bx-text); }
    label > textarea { font: var(--bx-font-code); }
    label.inline { flex-direction: row; align-items: center; gap: 8px; text-transform: none; letter-spacing: normal; font: var(--bx-font); color: var(--bx-text); flex: 0 0 auto; }
    .bx button.go { background: var(--bx-accent); border-color: var(--bx-accent); color: var(--bx-accent-ink); }
    .bx button.go:hover { background: var(--bx-accent-hover); border-color: var(--bx-accent-hover); }
    .bx button.rm { color: var(--bx-danger); border-color: var(--bx-danger); }
    .bx button:disabled { opacity: .5; cursor: default; }
    a { color: var(--bx-link); }
    table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
    td { padding: 4px 8px 4px 0; border-top: 1px solid var(--bx-border); vertical-align: top; }
    details > summary { cursor: pointer; margin: 8px 0; }
  </style>
</head>
<body class="bx">
<main id="app"></main>
<script type="module" src="./scm.js"></script>
</body>
</html>
