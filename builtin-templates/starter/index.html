<!doctype html>

<!--
  data-bx-theme="auto": the page follows the person's light or dark theme.
  Style it with theme.css's tokens (var(--bx-text), --bx-panel, --bx-accent,
  --bx-radius, --bx-font…), never colours or fonts of your own, and it stays
  right in both (docs/frontend-kit.md).
-->
<html lang="en" data-bx-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>starter</title>
  <link rel="stylesheet" href="/vendor/theme.css">
  <style>
    body { margin: 0; padding: 20px; font: var(--bx-font-body); }
    h1 { margin: 0 0 4px; font: var(--bx-font-heading); letter-spacing: var(--bx-tracking-heading); }
    p { margin: 4px 0; color: var(--bx-muted); }
    code { background: var(--bx-panel-2); padding: 0 4px; border-radius: var(--bx-radius); font: var(--bx-font-code); }
  </style>
</head>
<body class="bx">
  <h1>starter</h1>
  <p>A blank component, instantiated from a template. Open a terminal on it
     (the edit button, top-right) and start building.</p>
</body>
