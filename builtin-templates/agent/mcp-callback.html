<!doctype html>
<!--
  mcp-callback.html — where an MCP server's authorization page sends a person
  back after a sign-in (API.md "Direct MCP servers"; model/mcp-direct.js
  redirectUri). It hands the code and state to POST /mcp/oauth/callback — at
  the global instance when the state says the sign-in started there ("g…") —
  drops them from the address bar, and says how it went. The code is
  single-use and bound to the PKCE verifier the backend kept: on its own it
  signs no one in.
-->
<html lang="en" data-bx-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MCP sign-in</title>
  <link rel="stylesheet" href="/vendor/theme.css">
  <style>
    body.bx { display: grid; place-items: center; min-height: 100vh; margin: 0; }
    .card { max-width: 480px; padding: 20px 24px; border: 1px solid var(--bx-border); border-radius: var(--bx-radius); background: var(--bx-panel); }
    .card h1 { font: var(--bx-font); font-size: 16px; font-weight: 600; margin: 0 0 8px; }
    .ok { color: var(--bx-green); }
    .err { color: var(--bx-red); overflow-wrap: anywhere; }
    .muted { color: var(--bx-muted); }
  </style>
</head>
<body class="bx">
  <div class="card"><h1 id="title">Finishing the sign-in…</h1><div id="out" class="muted">One moment.</div></div>
  <script type="module">
    const q = new URLSearchParams(location.search);
    const body = { state: q.get('state') || '', code: q.get('code') || '', iss: q.get('iss') || '', error: q.get('error') || '', errorDescription: q.get('error_description') || '' };
    history.replaceState(null, '', location.pathname); // the code leaves the address bar (and history) at once
    const title = document.getElementById('title');
    const out = document.getElementById('out');
    const say = (head, text, cls) => { title.textContent = head; out.textContent = text; out.className = cls; };
    if (!body.state) {
      say('Nothing to finish', 'This page finishes an MCP server sign-in started in the agent\'s Settings → MCP.', 'muted');
    } else {
      try {
        // xbin.fetch itself: it alone honours partition (bx-kit's selfApi uses it only in a sandboxed document)
        const f = globalThis.xbin?.fetch || fetch;
        const res = await f(`/api/${globalThis.xbin?.self}/mcp/oauth/callback`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body), ...(body.state.startsWith('g') ? { partition: 'global' } : {}) });
        const r = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(r.error || `error ${res.status}`);
        const s = r.server || {};
        const n = (s.tools || []).length;
        say('Signed in', `${s.name || 'The MCP server'} is connected${n ? ` — ${n} tool${n === 1 ? '' : 's'}` : ''}. You can close this tab.`, 'ok');
      } catch (e) {
        say('The sign-in didn\'t finish', `${e.message}. Start it again from Settings → MCP.`, 'err');
      }
    }
  </script>
</body>
</html>
