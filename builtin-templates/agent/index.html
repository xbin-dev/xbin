<!doctype html>
<!--
  The agent control + observability tile. Opinionated on purpose: a run list,
  a live timeline of the selected run (messages + the journal of every LLM call,
  tool call, compaction, yield…) with live-streaming partial output, plus the
  controls to steer it (message, answer/approve, interrupt, resume, compact,
  learn), a render pane for the HTML files the agent shows, and a tabbed
  settings area (config / features / memory / files / schedules / skills /
  MCP). Pure frontend talking to this component's own backend via
  xbin.fetch (raw fetch to /api/${xbin.self}<path>). No build step: plain ES
  modules, no framework — exactly like the rest of this tile.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AI Agent</title>
  <link rel="stylesheet" href="/vendor/theme.css">
  <style>
    /* The tile is an app shell: every scrollable region scrolls INSIDE itself
       (runs list, timeline, settings body), so the document itself must never
       scroll — a page-level scrollbar can only push the composer off the
       bottom. */
    body { margin: 0; font: 13px/1.5 system-ui, sans-serif; color: var(--bx-text); overflow: hidden; }
    /* Asks for ~2× the old default height — this is a control panel, not a
       strip — but never more than it was actually given: a flat min-height of
       640px keeps .wrap 640px tall inside a 400px card, which overflows the
       document and puts the message input below the fold. min() asks for 640
       when there is room and yields to the viewport when there isn't. */
    .wrap { display: grid; grid-template-columns: 220px 1fr; height: 100vh; min-height: min(640px, 100vh); }
    .side { border-right: 1px solid var(--bx-border); display: flex; flex-direction: column; min-height: 0; background: var(--bx-panel-2); }
    .side .hd { padding: 8px 10px; display: flex; gap: 6px; align-items: center; border-bottom: 1px solid var(--bx-border); }
    .side .hd b { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--bx-muted); flex: 1; }
    .runs { overflow: auto; flex: 1; }
    .run { padding: 7px 10px; border-bottom: 1px solid var(--bx-border); cursor: pointer; }
    .run:hover { background: var(--bx-panel); }
    .run.on { background: var(--bx-panel); box-shadow: inset 3px 0 0 var(--bx-accent); }
    .run .t { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .run .m { font-size: 10.5px; color: var(--bx-muted); margin-top: 1px; display: flex; gap: 5px; align-items: center; }
    .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
    /* Top bar and composer never shrink: when .main runs out of height the
       squeeze has to land on the timeline, never on the controls. The
       timeline is flex:1 with a 0 basis, so it collapses first. */
    .top { flex: none; padding: 8px 12px; border-bottom: 1px solid var(--bx-border); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .top .title { font-weight: 600; flex: 1; min-width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .timeline { overflow: auto; flex: 1; padding: 10px 12px; min-height: 0; }
    .composer { flex: none; border-top: 1px solid var(--bx-border); padding: 8px 12px; display: flex; gap: 6px; }
    .composer input { flex: 1; }
    input, textarea, select {
      background: var(--bx-panel); border: 1px solid var(--bx-border); border-radius: 5px;
      color: var(--bx-text); font: inherit; padding: 4px 8px; box-sizing: border-box;
    }
    textarea { resize: vertical; }
    input:focus, textarea:focus, select:focus { outline: 2px solid color-mix(in srgb, var(--bx-accent) 30%, transparent); }
    .btn { background: var(--bx-accent); color: #fff; border: 0; border-radius: 5px; padding: 4px 12px;
           cursor: pointer; font: inherit; font-weight: 600; }
    .btn:hover { background: color-mix(in srgb, var(--bx-accent) 88%, #000); }
    .btn.ghost { background: var(--bx-panel); color: var(--bx-text); border: 1px solid var(--bx-border); font-weight: 500; }
    .btn.ghost:hover { background: var(--bx-panel-2); }
    .btn.rm { background: var(--bx-panel); color: var(--bx-red); border: 1px solid color-mix(in srgb, var(--bx-red) 40%, var(--bx-border)); font-weight: 500; }
    .btn.rm:hover { background: color-mix(in srgb, var(--bx-red) 14%, var(--bx-panel)); }
    .btn.btnsm { padding: 2px 9px; font-size: 11.5px; font-weight: 500; }
    .btn:disabled { opacity: .5; cursor: default; }
    .badge { font-size: 10px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--bx-border);
             text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
    .badge.running, .badge.sleeping { color: var(--bx-accent); border-color: color-mix(in srgb, var(--bx-accent) 50%, var(--bx-border)); }
    .badge.waiting_input { color: var(--bx-yellow, #d9a441); border-color: color-mix(in srgb, var(--bx-yellow, #d9a441) 45%, var(--bx-border)); }
    .badge.done { color: var(--bx-green); }
    .badge.error { color: var(--bx-red); }
    .badge.idle { color: var(--bx-muted); }
    .ev { border-left: 2px solid var(--bx-border); padding: 4px 0 4px 10px; margin: 2px 0; }
    .ev.user { border-color: var(--bx-accent); }
    .ev.assistant { border-color: #6aa9ff; }
    .ev.tool { border-color: #b58900; }
    .ev.step { border-color: var(--bx-border); }
    .ev.step.err { border-color: var(--bx-red); }
    .ev .role { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--bx-muted); }
    .ev .body { white-space: pre-wrap; word-break: break-word; margin-top: 1px; }
    /* markdown bodies: the renderer's own block layout, not pre-wrap */
    .body.md { white-space: normal; }
    .body.md > :first-child { margin-top: 0; }
    .body.md > :last-child { margin-bottom: 0; }
    .body.md p, .body.md ul, .body.md ol, .body.md blockquote { margin: 5px 0; }
    .body.md ul, .body.md ol { padding-left: 22px; }
    .body.md h1, .body.md h2, .body.md h3, .body.md h4 { margin: 8px 0 3px; font-size: 14px; }
    .body.md h1 { font-size: 16px; } .body.md h2 { font-size: 15px; }
    .body.md code { font-family: var(--bx-mono); font-size: 12px; background: var(--bx-panel-2);
      border: 1px solid var(--bx-border); border-radius: 4px; padding: 0 4px; }
    .body.md pre { background: var(--bx-panel-2); border: 1px solid var(--bx-border);
      border-radius: 6px; padding: 7px 9px; margin: 5px 0; overflow-x: auto; }
    .body.md pre code { background: none; border: 0; padding: 0; white-space: pre; }
    .body.md blockquote { border-left: 3px solid var(--bx-border); padding-left: 9px; color: var(--bx-muted); }
    .body.md table { border-collapse: collapse; margin: 5px 0; display: block; overflow-x: auto; }
    .body.md th, .body.md td { border: 1px solid var(--bx-border); padding: 2px 8px; font-size: 12.5px; }
    .body.md a { color: var(--bx-accent, #f5a623); text-decoration: underline; }
    .body.md hr { border: 0; border-top: 1px solid var(--bx-border); margin: 8px 0; }
    .ev.step .body { color: var(--bx-muted); font-size: 12px; }
    .ev.step.err .body { color: var(--bx-red); }
    .step-k { display: inline-block; color: var(--bx-muted); font-size: 10.5px; text-transform: uppercase;
              letter-spacing: .03em; margin-right: 5px; }
    /* Tool-call chips + tool results: collapsed to 1-2 lines, click to expand
       (.xwrap.on = expanded; toggle state survives re-renders via agent.js). */
    .tc { font-family: var(--bx-mono); font-size: 11.5px; background: var(--bx-panel-2);
          border: 1px solid var(--bx-border); border-radius: 5px; padding: 4px 7px; margin-top: 3px; overflow-x: auto; }
    .tc.xwrap { cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tc.xwrap::before { content: '▸ '; color: var(--bx-muted); }
    .tc.xwrap.on { white-space: pre-wrap; word-break: break-word; overflow: visible; }
    .tc.xwrap.on::before { content: '▾ '; }
    .ev.tool .role.xtoggle { cursor: pointer; }
    .ev.tool .role.xtoggle::before { content: '▸ '; }
    .ev.tool.xwrap.on .role.xtoggle::before { content: '▾ '; }
    .xhint { text-transform: none; letter-spacing: 0; }
    .ev.tool.xwrap .clampable { display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden; color: var(--bx-muted); font-size: 12px; }
    .ev.tool.xwrap.on .clampable { display: block; -webkit-line-clamp: unset;
      overflow: visible; color: var(--bx-text); font-size: 13px; }
    .ev.tool.bad { border-left: 2px solid var(--bx-red); padding-left: 8px; }
    .ev.tool.bad .role { color: var(--bx-red); }
    .muted { color: var(--bx-muted); }
    .mono { font-family: var(--bx-mono); }
    .ask { background: color-mix(in srgb, var(--bx-yellow, #d9a441) 12%, transparent);
           border: 1px solid color-mix(in srgb, var(--bx-yellow, #d9a441) 45%, var(--bx-border));
           border-radius: 6px; padding: 8px 10px; margin: 6px 0; }
    /* Live streaming draft (partial assistant text while status=running). */
    .draft { border-left: 2px solid #6aa9ff; padding: 4px 0 4px 10px; margin: 2px 0; }
    .draft .role { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--bx-muted); }
    .draft .body { white-space: pre-wrap; word-break: break-word; margin-top: 1px; }
    .cur { display: inline-block; width: 6px; height: 13px; background: var(--bx-accent);
           margin-left: 2px; vertical-align: text-bottom; animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* Workflow view — shares #timeline's slot rather than adding a third row,
       so the composer geometry the layout test pins is untouched. */
    .wfpane { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    .wfpane[hidden] { display: none; }
    .main.wfon #timeline { display: none; }
    /* ⤢ maximizes the render pane by hiding the timeline; it must hide this
       too, or a maximized render leaves a tree stacked above it. */
    .main.prev-max .wfpane { display: none; }
    .wfhd { flex: none; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
            padding: 6px 10px; border-bottom: 1px solid var(--bx-border);
            background: var(--bx-panel-2); font-size: 11.5px; }
    .wfhd .wft { font-weight: 600; min-width: 0; max-width: 45%;
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wfcost { color: var(--bx-muted); font-size: 11px; white-space: nowrap; }
    .wfbody { flex: 1; min-height: 0; overflow: auto; padding: 3px 0 10px; }
    /* GRID, not flex: 1fr on the title column is what guarantees a long
       model-authored title can never widen the row, so the 480px no-horizontal
       -scroll rule is enforced by the layout rather than by hoping. */
    .wfn { display: grid; grid-template-columns: 1fr auto; gap: 1px 8px; align-items: center;
           padding: 4px 10px 4px calc(10px + var(--d, 0) * 13px);
           border-left: 3px solid transparent; cursor: pointer; }
    .wfn:hover { background: var(--bx-panel); }
    .wfn.on { background: var(--bx-panel); border-left-color: var(--bx-accent); }
    .wfn .nm { display: flex; align-items: center; gap: 5px; min-width: 0; }
    .wfn .nm .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* A dot, not a badge: fifty badges is a wall of text, while a pulsing dot
       answers "is anything alive" in one glance. */
    .wfn .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--bx-muted); }
    .wfn .dot.running { background: var(--bx-accent); animation: pulse 1.4s ease-in-out infinite; }
    .wfn .dot.queued { background: var(--bx-accent); opacity: .45; }
    .wfn .dot.blocked { background: var(--bx-yellow, #d9a441); }
    .wfn .dot.done { background: var(--bx-green); }
    .wfn .dot.error, .wfn .dot.cancelled { background: var(--bx-red); }
    @keyframes pulse { 50% { opacity: .3; } }
    .wfn .cost { font-family: var(--bx-mono); font-size: 10.5px; color: var(--bx-muted);
                 white-space: nowrap; justify-self: end; text-align: right; }
    /* Share-of-tree bar: an absolute number tells you nothing, a bar shows
       which node ate the budget. */
    .wfn .share { display: block; height: 2px; background: var(--bx-border); margin-top: 2px; }
    .wfn .share > i { display: block; height: 100%; background: var(--bx-accent); }
    /* Second line spans one column so it wraps under the title and can never
       widen the row. */
    .wfn .sub { grid-column: 1 / 2; font-size: 10.5px; color: var(--bx-muted);
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wfn .sub.blk { color: var(--bx-yellow, #d9a441); }
    .wfn .sub.bad { color: var(--bx-red); }
    .badge.wfchip { cursor: pointer; }
    .run .roll { font-size: 10px; color: var(--bx-muted); white-space: nowrap; margin-left: auto; }
    .run .m { display: flex; }
    /* The twisty is a click target inside a clickable row, so it needs enough
       area to hit without selecting the run by accident. */
    .run .tw { display: inline-block; width: 13px; color: var(--bx-muted); user-select: none; }
    .run .tw[data-tw] { cursor: pointer; }
    .run .tw[data-tw]:hover { color: var(--bx-text); }

    /* Render pane — an in-flow split of .main, above the composer. The basis
       is clamp(px, vh, px) and never a %: .wrap is height:100vh with a
       min-height, so at short viewports the row height is indefinite and a %
       flex-basis collapses the pane to nothing. ⤢ hides the timeline when you
       want the whole column for the render. */
    .preview { display: flex; flex-direction: column; min-height: 0;
               flex: 0 1 clamp(120px, 40vh, 520px);
               border-top: 1px solid var(--bx-border); background: var(--bx-panel-2); }
    .preview[hidden] { display: none; }
    .main.prev-max #timeline { display: none; }
    .main.prev-max .preview { flex: 1 1 auto; }
    .preview .phd { display: flex; align-items: center; gap: 6px; padding: 5px 8px 5px 10px;
                    border-bottom: 1px solid var(--bx-border); font-size: 11.5px; }
    .preview .ppath { min-width: 40px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .preview .badge { color: var(--bx-muted); }
    .preview .pwarn { color: var(--bx-yellow, #d9a441); white-space: nowrap; overflow: hidden;
                      text-overflow: ellipsis; }
    .preview .pbody { flex: 1; min-height: 0; position: relative; }
    /* The frame is the only thing allowed to overflow: arbitrary model HTML
       scrolls inside its own viewport, so the tile never scrolls sideways.
       The white background and color-scheme are forced because arbitrary HTML
       assumes a light page — including the UA scrollbars and form controls. */
    .prevframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
                 display: block; background: #fff; color-scheme: light; }

    /* render_html chip in the timeline. */
    .rchip { font-family: var(--bx-mono); font-size: 11.5px; cursor: pointer; padding: 1px 7px;
             border: 1px solid color-mix(in srgb, var(--bx-accent) 45%, var(--bx-border));
             border-radius: 5px; }
    .rchip:hover { border-color: var(--bx-accent); background: var(--bx-panel-2); }
    .rchip.on { background: color-mix(in srgb, var(--bx-accent) 16%, transparent); }

    /* Sandbox results and file contents read as code: tracebacks and aligned
       columns are unreadable in the UI font. An attribute selector, not a
       class, because MCP tool names contain colons. */
    .ev.tool[data-tool="js_eval"] .body, .ev.tool[data-tool="js_run"] .body,
    .ev.tool[data-tool="file_read"] .body { font-family: var(--bx-mono); font-size: 12px; }

    /* Settings panel — overlays the run view (timeline+composer) when open. */
    .settings { position: absolute; inset: 0; background: var(--bx-panel); display: flex; flex-direction: column; z-index: 5; }
    .settings[hidden] { display: none; }
    .tabs { display: flex; gap: 2px; padding: 6px 8px; border-bottom: 1px solid var(--bx-border);
            background: var(--bx-panel-2); align-items: center; flex-wrap: wrap; }
    .tab { background: transparent; border: 1px solid transparent; border-radius: 5px; color: var(--bx-muted);
           font: inherit; font-size: 12px; font-weight: 600; padding: 4px 10px; cursor: pointer; }
    .tab:hover { color: var(--bx-text); background: var(--bx-panel); }
    .tab.on { color: var(--bx-text); background: var(--bx-panel); border-color: var(--bx-border); }
    .settings-bd { overflow: auto; flex: 1; padding: 12px 14px; }
    .sec { margin-bottom: 16px; }
    .sec > h4 { margin: 0 0 7px; font-size: 10.5px; font-weight: 600; letter-spacing: .08em;
                text-transform: uppercase; color: var(--bx-muted); display: flex; align-items: center; gap: 8px; }
    .grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
    .chk { display: flex; align-items: center; gap: 7px; font-size: 12.5px; padding: 3px 0; }
    .chk input[type=checkbox] { accent-color: var(--bx-accent); width: 15px; height: 15px; flex: none; }
    .hint { color: var(--bx-muted); font-size: 11.5px; margin: 5px 0 0; }
    .err { color: var(--bx-red); font-size: 12px; }
    .card { border: 1px solid var(--bx-border); border-radius: 6px; padding: 8px 10px; margin-bottom: 7px; background: var(--bx-panel-2); }
    .card .ch { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .card .ch .nm { font-weight: 600; flex: 1; min-width: 80px; }
    .kv { display: grid; grid-template-columns: 150px 1fr auto; gap: 6px; align-items: center; margin-bottom: 5px; }
    .kv .mono { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    table.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
    table.tbl th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
                   color: var(--bx-muted); font-weight: 600; padding: 3px 8px 3px 0; }
    table.tbl td { padding: 4px 8px 4px 0; border-top: 1px solid var(--bx-border); vertical-align: top; }

    dialog { background: var(--bx-panel); color: var(--bx-text); border: 1px solid var(--bx-border);
             border-radius: 8px; padding: 0; width: min(520px, 92vw); }
    dialog::backdrop { background: rgba(0,0,0,.5); }
    .dlg-hd { padding: 10px 14px; border-bottom: 1px solid var(--bx-border); font-weight: 600; }
    .dlg-bd { padding: 12px 14px; display: grid; gap: 8px; max-height: 70vh; overflow: auto; }
    .dlg-ft { padding: 10px 14px; border-top: 1px solid var(--bx-border); display: flex; gap: 8px; justify-content: flex-end; }
    .field label { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: .05em;
                   text-transform: uppercase; color: var(--bx-muted); margin-bottom: 2px; }
    .field input, .field textarea, .field select { width: 100%; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .empty { color: var(--bx-muted); padding: 24px; text-align: center; }

    /* Home (no run selected): greeting + recent quick asks. */
    .home { max-width: 640px; margin: 0 auto; padding: 26px 16px 12px; }
    .home .hi { font-size: 17px; font-weight: 650; margin-bottom: 3px; }
    .home .sub { color: var(--bx-muted); font-size: 12.5px; margin-bottom: 16px; }
    .home .exs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
    .home .ex { font-size: 11.5px; color: var(--bx-muted); border: 1px solid var(--bx-border);
                border-radius: 999px; padding: 3px 10px; cursor: pointer; background: var(--bx-panel-2); }
    .home .ex:hover { color: var(--bx-text); border-color: var(--bx-accent); }
    .home h5 { margin: 0 0 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .08em;
               text-transform: uppercase; color: var(--bx-muted); }
    .qa { border: 1px solid var(--bx-border); border-radius: 7px; padding: 8px 11px; margin-bottom: 7px;
          background: var(--bx-panel-2); cursor: pointer; }
    .qa:hover { border-color: var(--bx-accent); }
    .qa .q { font-weight: 600; font-size: 12.5px; display: flex; gap: 7px; align-items: center; }
    .qa .q .when { font-weight: 400; color: var(--bx-muted); font-size: 10.5px; margin-left: auto; white-space: nowrap; }
    .qa .a { color: var(--bx-muted); font-size: 12px; margin-top: 3px; white-space: pre-wrap;
             display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .brand { cursor: pointer; }
    .brand:hover { color: var(--bx-text); }
  </style>
</head>
<body class="bx">
  <div class="wrap">
    <div class="side">
      <div class="hd"><b class="brand" id="home" title="Home — quick asks">⌂ Home</b>
        <button class="btn btnsm" id="new" title="New task run">+ Task</button>
        <button class="btn ghost btnsm" id="gear" title="Settings">⚙</button>
        <!-- The brake lives here, not in .main: .settings overlays .main but
             never .side, so it stays one click away from every view state. -->
        <button class="btn rm btnsm" id="halt" title="Stop every running agent now" hidden>⏻</button>
      </div>
      <div class="runs" id="runs"><div class="empty">no tasks yet</div></div>
    </div>
    <div class="main" id="main">
      <div class="top" id="top"><span class="muted">select or start a run</span></div>
      <div class="timeline" id="timeline"><div class="empty">—</div></div>

      <!-- Workflow view. A SIBLING of #timeline that takes the SAME flex slot:
           the two are alternatives, never both, so the geometry above the
           composer is byte-identical to today and every assertion in
           test/layout.mjs still holds. NOT an overlay like .settings, because
           the loop is watch-the-tree-and-steer-the-parent and an overlay would
           cover the composer. -->
      <div class="wfpane" id="workflow" hidden>
        <div class="wfhd">
          <span class="wft" id="wf-title"></span>
          <span class="badge" id="wf-counts"></span>
          <span style="flex:1"></span>
          <span class="wfcost mono" id="wf-cost"></span>
          <button class="btn rm btnsm" id="wf-stop" title="Cancel this workflow and everything below it">Stop</button>
          <button class="btn ghost btnsm" id="wf-close" title="Back to the timeline (Esc)">✕</button>
        </div>
        <div class="wfbody" id="wf-body"></div>
      </div>

      <!-- Render pane (render_html). A SIBLING of #timeline, never a child:
           loadDetail() rebuilds #timeline.innerHTML on every poll tick and its
           change key includes the streaming draft, so an iframe in there would
           be torn down and rebuilt on every streamed token. It is also NOT an
           overlay like .settings — that would cover the composer, and the whole
           loop is "look at the render, ask for a change, look again".
           The <iframe> is static markup, created once at page load; JS only
           ever assigns its .srcdoc property. sandbox="" is the entire isolation
           story for untrusted model HTML: no scripts, no forms, no navigation,
           opaque origin. frameDoc() adds a meta CSP on top, because sandbox=""
           still permits subresource LOADS (a remote <img> would beacon). -->
      <div class="preview" id="preview" hidden>
        <div class="phd">
          <span>🖼</span>
          <span class="ppath mono" id="prev-path"></span>
          <span class="badge" id="prev-ver"></span>
          <span class="pwarn" id="prev-warn" hidden></span>
          <span style="flex:1"></span>
          <button class="btn ghost btnsm" id="prev-src" title="Open this file in the Files tab">Source</button>
          <button class="btn ghost btnsm" id="prev-max" title="Maximize / restore">⤢</button>
          <button class="btn ghost btnsm" id="prev-close" title="Close (Esc)">✕</button>
        </div>
        <div class="pbody">
          <iframe id="prevframe" class="prevframe" sandbox="" referrerpolicy="no-referrer"
                  title="rendered output — static, no scripts"></iframe>
        </div>
      </div>

      <div class="composer">
        <button class="btn ghost" id="tset" title="Tool mode for new asks: 🔒 private data (internal systems, no web) / 🌐 web (no internal systems). A run keeps its mode.">🔒</button>
        <input id="msg" placeholder="ask anything…" autocomplete="off">
        <button class="btn" id="send">Send</button>
      </div>

      <!-- Tabbed settings, overlaying the run view. -->
      <div class="settings" id="settings" hidden>
        <div class="tabs" id="tabs">
          <button class="tab on" data-tab="config">Config</button>
          <button class="tab" data-tab="features">Features</button>
          <button class="tab" data-tab="memory">Memory</button>
          <button class="tab" data-tab="files">Files</button>
          <button class="tab" data-tab="schedules">Schedules</button>
          <button class="tab" data-tab="skills">Skills</button>
          <button class="tab" data-tab="mcp">MCP</button>
          <span style="flex:1"></span>
          <button class="tab" id="settings-close" title="Close settings">✕</button>
        </div>
        <div class="settings-bd" id="sbd"></div>
      </div>
    </div>
  </div>

  <dialog id="newdlg">
    <form method="dialog">
      <div class="dlg-hd">New run</div>
      <div class="dlg-bd">
        <div class="field"><label>Goal</label><textarea id="n-goal" rows="3" placeholder="what should the agent do?"></textarea></div>
        <div class="field"><label>Tool mode</label><select id="n-toolset">
          <option value="private">🔒 private data — internal systems, no web</option>
          <option value="web">🌐 web — no internal systems</option>
        </select></div>
        <div class="field"><label>Title (optional)</label><input id="n-title"></div>
        <div class="field"><label>System prompt override (optional)</label><textarea id="n-system" rows="3"></textarea></div>
      </div>
      <div class="dlg-ft"><button class="btn ghost" value="cancel">Cancel</button><button class="btn" id="n-create" value="ok">Create</button></div>
    </form>
  </dialog>

  <script type="module" src="agent.js"></script>
</body>
</html>
