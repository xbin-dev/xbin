<!doctype html>
<!--
  The agent control + observability tile. Opinionated on purpose: a run list
  (top-level runs; subagents live inside their parent's session), the live chat
  of the selected run — streamed thinking, a card per tool call with the
  model's own one-line summary, subagents nested inline with their own
  thinking and tools — the controls to steer it (a message while it works is
  queued for its next step; Stop; approve; compact; learn), a render pane for
  the HTML files the agent shows, the workflow tree, and a tabbed settings area
  (config / features / memory / files / skills / MCP), the Automations page. Pure
  frontend talking to this component's own backend via xbin.fetch over one
  live stream (no polling). No build step: plain ES modules and lit's render().
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AI Agent</title>
  <link rel="stylesheet" href="/vendor/theme.css">
  <style>
    /* The tile is an app shell: every scrollable region scrolls INSIDE itself
       (runs list, timeline, settings body), so the document itself must never
       scroll — a page-level scrollbar can only push the composer off the
       bottom. */
    body { margin: 0; font: 13px/1.5 system-ui, sans-serif; color: var(--bx-text); overflow: hidden; }
    /* Asks for ~2× the old default height — this is a control panel, not a
       strip — but never more than it was actually given: a flat min-height of
       640px keeps .wrap 640px tall inside a 400px card, which overflows the
       document and puts the message input below the fold. min() asks for 640
       when there is room and yields to the viewport when there isn't. */
    .wrap { display: grid; grid-template-columns: 220px 1fr; height: 100vh; min-height: min(640px, 100vh); }
    .side { border-right: 1px solid var(--bx-border); display: flex; flex-direction: column; min-height: 0; background: var(--bx-panel-2); }
    .side .hd { padding: 8px 10px; display: flex; gap: 6px; align-items: center; border-bottom: 1px solid var(--bx-border); }
    .side .hd b { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--bx-muted); flex: 1; white-space: nowrap; }
    .runs { overflow: auto; flex: 1; padding: 2px 0 6px; }
    /* the conversation list (sidebar.js): date groups, one line per chat */
    .side .sq { padding: 6px 8px; border-bottom: 1px solid var(--bx-border); display: flex; flex-direction: column; gap: 6px; }
    .side .newrow { display: flex; gap: 6px; }
    .side .newrow #new { flex: 1; }
    .side .sq input { width: 100%; box-sizing: border-box; font-size: 12px; padding: 4px 7px; }
    .grp { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--bx-muted); padding: 9px 10px 3px; }
    .run { padding: 5px 6px 5px 10px; cursor: pointer; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; border-radius: 5px; margin: 0 4px; }
    .run:hover { background: var(--bx-panel); }
    .run.on { background: var(--bx-panel); box-shadow: inset 3px 0 0 var(--bx-accent); }
    .run .t { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
    .run.unread .t { font-weight: 650; }
    .run .gl { font-size: 10.5px; color: var(--bx-muted); flex: none; }
    .run .gl.err { color: var(--bx-red); }
    .run .gl.ask { color: var(--bx-yellow, #d9a441); font-weight: 700; }
    .run .rmenu { visibility: hidden; flex: none; border: 0; background: none; color: var(--bx-muted); cursor: pointer; padding: 0 3px; font-size: 13px; line-height: 1; }
    .run:hover .rmenu, .run.on .rmenu { visibility: visible; }
    .run .snip { flex-basis: 100%; font-size: 11px; color: var(--bx-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .run .ren { width: 100%; font-size: 12px; padding: 2px 4px; }
    .runs .more { display: block; margin: 6px auto; }
    .mback { position: fixed; inset: 0; z-index: 30; }
    .rowmenu { position: fixed; z-index: 31; min-width: 130px; background: var(--bx-panel); border: 1px solid var(--bx-border);
               border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.35); padding: 4px 0; font-size: 12px; }
    .rowmenu .mi { padding: 5px 12px; cursor: pointer; }
    .rowmenu .mi:hover { background: var(--bx-panel-2); }
    .rowmenu .mi.rm { color: var(--bx-red); }
    /* the Automations entry and page (automations.js) */
    .autos-entry { display: flex; gap: 6px; align-items: center; margin: 6px 4px 0; padding: 6px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; }
    .autos-entry:hover, .autos-entry.on { background: var(--bx-panel); }
    .autos-entry.on { box-shadow: inset 3px 0 0 var(--bx-accent); }
    .badge.unread { color: var(--bx-accent); border-color: var(--bx-accent); }
    .autos-page { max-width: 760px; margin: 0 auto; padding: 14px 16px; }
    .autos-page .ahd { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
    .autos-page .ahd h3 { margin: 0; font-size: 15px; }
    .autos-page h5 { margin: 14px 0 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--bx-muted); }
    .autos-page .empty-line { padding: 4px 2px; }
    .autos-page .agoal { white-space: pre-wrap; margin: 8px 0; padding: 8px 10px; border: 1px solid var(--bx-border); border-radius: 6px; background: var(--bx-panel-2); }
    .autos-page .field { margin-bottom: 10px; }
    .autos-page .field input, .autos-page .field textarea, .autos-page .field select { width: 100%; box-sizing: border-box; }
    .acard2 { border: 1px solid var(--bx-border); border-radius: 7px; padding: 8px 10px; margin-bottom: 6px; cursor: pointer; background: var(--bx-panel); }
    .acard2:hover { border-color: var(--bx-accent); }
    .acard2.off { opacity: .65; }
    .acard2 .ah { display: flex; gap: 6px; align-items: center; }
    .acard2 .nm { font-weight: 600; }
    .acard2 .as { margin-top: 2px; }
    .crumb { cursor: pointer; color: var(--bx-accent); font-size: 12px; }
    /* chat channels (auto-channels.js) */
    .chrow { display: flex; gap: 8px; align-items: center; padding: 4px 2px; border-bottom: 1px solid var(--bx-border); }
    .chrow a { cursor: pointer; color: var(--bx-accent); }
    .chadd { display: flex; gap: 6px; margin: 6px 0; }
    .chadd input { flex: 1; max-width: 260px; }
    .autos-page .note { margin: 6px 0; padding: 6px 10px; border-left: 3px solid var(--bx-accent); background: var(--bx-panel-2); }
    .autos-page .field .chk { display: block; margin: 2px 0; text-transform: none; letter-spacing: normal; font-size: 12px;
                              font-weight: normal; color: var(--bx-text); }
    .autos-page .field .chk input { width: auto; }
    /* the list's views switch (sidebar.js viewsTpl): the one you're in is unmistakable */
    .views { display: flex; margin: 6px 8px 2px; border: 1px solid var(--bx-border); border-radius: 6px; overflow: hidden; }
    .views .seg { flex: 1; border: 0; border-right: 1px solid var(--bx-border); background: transparent; color: var(--bx-muted);
                  font: inherit; font-size: 11.5px; padding: 4px 0; cursor: pointer; }
    .views .seg:last-child { border-right: 0; }
    .views .seg:hover { color: var(--bx-text); }
    .views .seg.on { background: var(--bx-panel); color: var(--bx-text); font-weight: 600; box-shadow: inset 0 -2px 0 var(--bx-accent); }
    /* how a shared row is shared (model/rules.js rowShared) */
    .run .chips { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 3px; margin-top: 2px; }
    .chip { font-size: 10px; line-height: 1.5; padding: 0 6px; border-radius: 999px; border: 1px solid var(--bx-border); color: var(--bx-muted); white-space: nowrap; }
    .chip.team, .chip.people { color: var(--bx-accent); border-color: color-mix(in srgb, var(--bx-accent) 50%, var(--bx-border)); }
    .chip.from { color: var(--bx-text); }
    /* the composer's model picker (model/rules.js modelPicker) */
    .msel { max-width: 180px; font-size: 12px; padding: 4px 6px; background: var(--bx-panel); color: var(--bx-text);
            border: 1px solid var(--bx-border); border-radius: 6px; align-self: flex-end; text-overflow: ellipsis; }
    /* the composer's class picker and the top bar's class (classes.js, model/classes.js) */
    .clspick { position: relative; align-self: flex-end; flex: none; }
    .clspick[hidden] { display: none; }
    .clsbtn { display: inline-flex; align-items: center; gap: 4px; max-width: 170px; }
    .clsbtn .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
    .clsbtn .car { color: var(--bx-muted); font-size: 10px; }
    .clsbtn.mixed, .badge.clswarn { color: var(--bx-yellow, #d9a441); border-color: color-mix(in srgb, var(--bx-yellow, #d9a441) 50%, var(--bx-border)); }
    .clsmenu { position: absolute; bottom: calc(100% + 6px); left: 0; z-index: 31; width: 340px; max-height: 60vh; overflow: auto;
               background: var(--bx-panel); border: 1px solid var(--bx-border); border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.35); padding: 4px 0; font-size: 12px; }
    .clsmenu .clshd { padding: 4px 12px 6px; color: var(--bx-muted); font-size: 11px; }
    .clsmenu .mi { display: flex; gap: 8px; align-items: flex-start; padding: 6px 12px; cursor: pointer; }
    .clsmenu .mi:hover, .clsmenu .mi.on { background: var(--bx-panel-2); }
    .clsmenu .mi .tx { flex: 1; min-width: 0; }
    .clsmenu .mi .ic { width: 1.4em; text-align: center; flex: none; }
    .clsmenu .ds { display: block; color: var(--bx-muted); font-size: 11.5px; }
    .clsmenu .ds.warn { color: var(--bx-yellow, #d9a441); }
    .clsmenu .ck { color: var(--bx-accent); width: 1em; }
    .clsrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 7px 0; border-top: 1px solid var(--bx-border); }
    .clsrow .lb { font-weight: 600; }
    .clsrow .ds { flex-basis: 100%; color: var(--bx-muted); font-size: 11.5px; }
    .clslist { margin: 8px 0 10px; }
    .clsdef { max-width: 360px; margin-top: 12px; }
    .clsnames { display: flex; flex-wrap: wrap; gap: 0 14px; margin-top: 4px; }
    .clsform .field, .clsdef { margin-bottom: 10px; }
    .clsform .field .chk { display: flex; text-transform: none; letter-spacing: normal; font-size: 12.5px; font-weight: 400; color: var(--bx-text); margin: 0; }
    .clsform .field .chk input { width: 15px; }
    .clsmixed { margin: 8px 0; padding: 7px 10px; border-radius: 6px; font-size: 12px;
                background: color-mix(in srgb, var(--bx-yellow, #d9a441) 12%, transparent); border: 1px solid color-mix(in srgb, var(--bx-yellow, #d9a441) 45%, var(--bx-border)); }
    /* coding sandboxes (sandboxes.js, model/sandboxes.js): the composer's #ssel, the top bar's ▣ and its popover, the dialog */
    .ssel[hidden] { display: none; }
    .sbxwrap { position: relative; display: inline-flex; }
    .badge.sbxbadge { cursor: pointer; text-transform: none; letter-spacing: 0; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--bx-mono); }
    .badge.sbxbadge.broken { color: var(--bx-red); border-color: color-mix(in srgb, var(--bx-red) 50%, var(--bx-border)); }
    .sbxpop { position: absolute; top: calc(100% + 6px); left: 0; z-index: 31; width: min(340px, 86vw); padding: 10px 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px;
              background: var(--bx-panel); border: 1px solid var(--bx-border); border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.35); font-size: 12px; }
    .sbxhd { display: flex; flex-direction: column; gap: 1px; }
    .sbxcwd { display: flex; gap: 6px; }
    .sbxports .prow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 11.5px; margin: 3px 0; }
    .sbxports .prow > .mono { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .sbxports .pres { flex-basis: 100%; overflow-wrap: anywhere; }
    .sbxports .pres.ok { color: var(--bx-green); }
    .sbxports .pres.bad { color: var(--bx-red); }
    .sbxports .pprobe #ports-port { flex: 0 0 64px; }
    .sbxcwd input { flex: 1; min-width: 0; }
    .sbxatt { padding: 3px 6px; border-radius: 5px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sbxatt:hover, .sbxatt.on { background: var(--bx-panel-2); }
    .sbxshr { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 2px 0; }
    .sbxacts { display: flex; gap: 6px; align-items: center; }
    .sbxdlg { width: min(640px, 94vw); }
    .sbxdhd { display: flex; align-items: center; gap: 6px; }
    .sbxrow { padding: 7px 0; border-top: 1px solid var(--bx-border); }
    .sbxlist > .sbxrow:first-child { border-top: 0; padding-top: 0; }
    .sbxrow.on .nm { color: var(--bx-accent); }
    .sbxrow .l1 { display: flex; align-items: flex-start; gap: 6px 12px; }
    .sbxrow .hd { flex: 1 1 0; min-width: 0; min-height: 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
    .sbxrow .nm { overflow-wrap: anywhere; }
    /* the actions keep one line while the name column keeps 160px; past that they wrap within themselves */
    .sbxrow .acts { flex: 0 0 auto; max-width: calc(100% - min(160px, 40%) - 12px); display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
    .sbxrow .l2 { font-size: 11.5px; margin-top: 3px; }
    @media (max-width: 520px) {
      .sbxrow .l1 { flex-wrap: wrap; }
      .sbxrow .acts { flex-basis: 100%; max-width: none; }
    }
    .badge.sbxst.running { color: var(--bx-green); }
    .badge.sbxst.error { color: var(--bx-red); }
    .badge.sbxon { color: var(--bx-accent); border-color: var(--bx-accent); }
    .sbxform { border-top: 1px solid var(--bx-border); padding-top: 8px; }
    .sbxform .field { margin-bottom: 8px; }
    /* the terminal pane (sandboxes.js): a shell in a sandbox, over the chat — not a modal, so Escape reaches the shell */
    /* docked under the top bar, clear of the composer; ⤢ fills the window */
    .sbxterm { position: fixed; top: 46px; right: 12px; z-index: 40; width: min(860px, calc(100vw - 24px)); height: min(460px, calc(100vh - 170px));
               min-height: 180px; display: flex; flex-direction: column; background: var(--bx-panel); border: 1px solid var(--bx-border); border-radius: 8px;
               box-shadow: 0 10px 34px rgba(0,0,0,.45); overflow: hidden; }
    .sbxterm.max { top: 12px; left: 12px; bottom: 12px; width: auto; height: auto; }
    .sbxthd { display: flex; align-items: center; gap: 8px; padding: 5px 8px 5px 12px; border-bottom: 1px solid var(--bx-border); min-width: 0; white-space: nowrap; }
    .sbxthd > .mono, .sbxthd > .muted { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .sbxtbody { flex: 1 1 0; min-height: 0; display: flex; padding: 4px 2px 2px 8px; background: var(--bx-term-bg, #262c36); }
    /* the dock's tabs (terminals.js): one per terminal; ▾ hides the dock, a top-bar pill brings it back */
    .sbxttabs { display: flex; gap: 2px; padding: 4px 6px 0; overflow-x: auto; border-bottom: 1px solid var(--bx-border); scrollbar-width: thin; }
    .sbxtab { display: inline-flex; align-items: center; gap: 4px; padding: 3px 4px 3px 10px; font-size: 12px; white-space: nowrap; cursor: pointer;
              border: 1px solid transparent; border-bottom: 0; border-radius: 6px 6px 0 0; color: var(--bx-muted); }
    .sbxtab.on { color: var(--bx-text); background: var(--bx-panel-2); border-color: var(--bx-border); }
    .sbxtab.ended { font-style: italic; }
    .sbxtab .x { background: none; border: 0; color: inherit; cursor: pointer; font-size: 11px; padding: 0 3px; }
    .sbxthint { padding: 2px 12px 4px; margin: 0; }
    /* a crowded header (a finished login: ended, "Finished. Signed in?", Retry, New shell) gives up the title, cwd and manager first — never what to do next */
    .sbxthd > b { overflow: hidden; text-overflow: ellipsis; min-width: 4em; }
    .sbxthd > .btn, .sbxthd > .badge, .sbxthd > #sbxterm-done { flex: none; }
    .termpill { cursor: pointer; color: var(--bx-accent); border-color: color-mix(in srgb, var(--bx-accent) 50%, var(--bx-border)); }
    /* a coding agent's sign-in (signin.js): its methods, the shared-HOME warning, a device code */
    .hlogin .hlm { display: flex; flex-direction: column; gap: 6px; margin: 8px 0 4px; }
    .hlogin .hlm form { display: flex; gap: 6px; align-items: center; }
    .hlogin .hlm input[type=password] { flex: 1 1 auto; min-width: 0; max-width: 340px; }
    .hlogin .hlm > .btn { align-self: flex-start; }
    .hlogin .hldev { margin: 6px 0; padding: 6px 8px; border: 1px dashed var(--bx-border); border-radius: 6px; overflow-wrap: anywhere; }
    .hlogin .acts { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
    /* the top bar's sharing status (model/rules.js shareStatus) */
    .sharepill.on { color: var(--bx-accent); border-color: color-mix(in srgb, var(--bx-accent) 50%, var(--bx-border)); }
    .sharepill.in { color: var(--bx-text); }
    /* a grant the owner gave this conversation (model/rules.js grantChips) */
    .grantchip { color: var(--bx-yellow, #d9a441); border-color: color-mix(in srgb, var(--bx-yellow, #d9a441) 50%, var(--bx-border)); }
    .grantchip .linkbtn { background: none; border: 0; padding: 0 0 0 4px; color: inherit; text-decoration: underline; cursor: pointer; font: inherit; }
    .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
    /* Top bar and composer never shrink: when .main runs out of height the
       squeeze has to land on the timeline, never on the controls. The
       timeline is flex:1 with a 0 basis, so it collapses first. */
    .top { flex: none; padding: 8px 12px; border-bottom: 1px solid var(--bx-border); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .top .title { font-weight: 600; flex: 1; min-width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .timeline { overflow: auto; flex: 1; padding: 10px 12px; min-height: 0; }
    /* the pinned task (D133, agent.js taskTpl): a line under the controls, unfolding to every request */
    .top .taskpin { flex-basis: 100%; display: flex; gap: 6px; align-items: baseline; min-width: 0; font-size: 12px; }
    .top .taskpin .tasktoggle { flex: none; align-self: flex-start; background: none; border: 0; padding: 0; cursor: pointer; font: inherit; color: var(--bx-muted); }
    .top .taskpin .taskline { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .top .taskpin.open { flex-direction: column; align-items: stretch; }
    .top .taskpin .asks { max-height: 40vh; overflow: auto; display: flex; flex-direction: column; gap: 8px; }
    .top .taskpin .askhead { color: var(--bx-muted); font-size: 11px; }
    .top .taskpin .asktext { white-space: pre-wrap; overflow-wrap: anywhere; }
    .composer { flex: none; border-top: 1px solid var(--bx-border); padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-end; }
    /* the pickers, then the message row; when both don't fit one line (a narrow tile, many pickers)
       the message row takes a line of its own, so the box keeps its width and Send stays on screen */
    .composer .cpicks, .composer .cinput { display: flex; gap: 6px; align-items: flex-end; min-width: 0; }
    .composer .cpicks { flex: 0 1 auto; flex-wrap: wrap; }
    .composer .cpicks:not(:has(> :not([hidden]))) { display: none; }
    .composer .cinput { flex: 1 1 17em; }
    .composer textarea { flex: 1; min-width: 0; resize: none; min-height: 30px; max-height: 40vh; line-height: 1.4; padding: 5px 8px; }
    .composer .btn { height: 30px; }
    /* Attachments waiting to be sent: a row above the composer, never inside
       it, so the composer's own geometry (test/layout.mjs) is unchanged. */
    .attach { flex: none; display: flex; flex-wrap: wrap; gap: 5px; padding: 6px 12px 0; border-top: 1px solid var(--bx-border); }
    .attach[hidden] { display: none; }
    .attach + .composer { border-top: 0; }
    .chip { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; font-size: 11.5px;
            border: 1px solid var(--bx-border); border-radius: 999px; padding: 1px 4px 1px 8px; background: var(--bx-panel); }
    .chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 22ch; }
    .chip .sz { color: var(--bx-muted); }
    .chip.up { border-color: var(--bx-accent); }
    .chip.bad { border-color: var(--bx-red); color: var(--bx-red); }
    .chip.done .sz::after { content: ' ✓'; }
    .chip button { border: 0; background: none; color: var(--bx-muted); cursor: pointer; padding: 0 3px; font: inherit; }
    .chip button:hover { color: var(--bx-red); }
    /* Attachments on a sent message: open the file in the Files tab. */
    .afiles { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .afile { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; cursor: pointer;
             border: 1px solid var(--bx-border); border-radius: 6px; padding: 2px 8px 2px 2px; background: var(--bx-panel); }
    .afile:hover { border-color: var(--bx-accent); }
    .afile.gone { cursor: default; opacity: .6; text-decoration: line-through; }
    .afile .ic { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 4px;
                 background: var(--bx-panel-2); overflow: hidden; font-size: 16px; }
    .afile .ic img { width: 100%; height: 100%; object-fit: cover; }
    .afile .sz { color: var(--bx-muted); }
    .main.dropping::after { content: 'Drop to attach'; position: absolute; inset: 6px; display: grid; place-items: center;
      border: 2px dashed var(--bx-accent); border-radius: 8px; font-weight: 600; color: var(--bx-accent);
      background: color-mix(in srgb, var(--bx-panel) 80%, transparent); pointer-events: none; z-index: 5; }
    .fprev { max-width: 100%; max-height: 360px; display: block; border: 1px solid var(--bx-border); border-radius: 6px; margin-bottom: 8px; }
    input, textarea, select {
      background: var(--bx-panel); border: 1px solid var(--bx-border); border-radius: 5px;
      color: var(--bx-text); font: inherit; padding: 4px 8px; box-sizing: border-box;
    }
    textarea { resize: vertical; }
    input:focus, textarea:focus, select:focus { outline: 2px solid color-mix(in srgb, var(--bx-accent) 30%, transparent); }
    .btn { background: var(--bx-accent); color: #fff; border: 0; border-radius: 5px; padding: 4px 12px;
           cursor: pointer; font: inherit; font-weight: 600; }
    .btn:hover { background: color-mix(in srgb, var(--bx-accent) 88%, #000); }
    .btn.ghost { background: var(--bx-panel); color: var(--bx-text); border: 1px solid var(--bx-border); font-weight: 500; }
    .btn.ghost:hover { background: var(--bx-panel-2); }
    .btn.rm { background: var(--bx-panel); color: var(--bx-red); border: 1px solid color-mix(in srgb, var(--bx-red) 40%, var(--bx-border)); font-weight: 500; }
    .btn.rm:hover { background: color-mix(in srgb, var(--bx-red) 14%, var(--bx-panel)); }
    .btn.btnsm { padding: 2px 9px; font-size: 11.5px; font-weight: 500; }
    .btn:disabled { opacity: .5; cursor: default; }
    .badge { font-size: 10px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--bx-border);
             text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
    .badge.running, .badge.sleeping { color: var(--bx-accent); border-color: color-mix(in srgb, var(--bx-accent) 50%, var(--bx-border)); }
    .badge.waiting_input { color: var(--bx-yellow, #d9a441); border-color: color-mix(in srgb, var(--bx-yellow, #d9a441) 45%, var(--bx-border)); }
    .badge.done { color: var(--bx-green); }
    .badge.error { color: var(--bx-red); }
    .badge.idle { color: var(--bx-muted); }
    .muted { color: var(--bx-muted); }
    .mono { font-family: var(--bx-mono); }
    .ask { background: color-mix(in srgb, var(--bx-yellow, #d9a441) 12%, transparent);
           border: 1px solid color-mix(in srgb, var(--bx-yellow, #d9a441) 45%, var(--bx-border));
           border-radius: 6px; padding: 8px 10px; margin: 6px 0; }
    /* Workflow view — shares #timeline's slot rather than adding a third row,
       so the composer geometry the layout test pins is untouched. */
    .wfpane { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    .wfpane[hidden] { display: none; }
    .main.wfon #timeline { display: none; }
    /* ⤢ maximizes the render pane by hiding the timeline; it must hide this
       too, or a maximized render leaves a tree stacked above it. */
    .main.prev-max .wfpane { display: none; }
    .wfhd { flex: none; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
            padding: 6px 10px; border-bottom: 1px solid var(--bx-border);
            background: var(--bx-panel-2); font-size: 11.5px; }
    .wfhd .wft { font-weight: 600; min-width: 0; max-width: 45%;
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wfcost { color: var(--bx-muted); font-size: 11px; white-space: nowrap; }
    .wfbody { flex: 1; min-height: 0; overflow: auto; padding: 3px 0 10px; }
    /* GRID, not flex: 1fr on the title column is what guarantees a long
       model-authored title can never widen the row, so the 480px no-horizontal
       -scroll rule is enforced by the layout rather than by hoping. */
    .wfn { display: grid; grid-template-columns: 1fr auto; gap: 1px 8px; align-items: center;
           padding: 4px 10px 4px calc(10px + var(--d, 0) * 13px);
           border-left: 3px solid transparent; cursor: pointer; }
    .wfn:hover { background: var(--bx-panel); }
    .wfn.on { background: var(--bx-panel); border-left-color: var(--bx-accent); }
    .wfn .nm { display: flex; align-items: center; gap: 5px; min-width: 0; }
    .wfn .nm .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* A dot, not a badge: fifty badges is a wall of text, while a pulsing dot
       answers "is anything alive" in one glance. */
    .wfn .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--bx-muted); }
    .wfn .dot.running { background: var(--bx-accent); animation: pulse 1.4s ease-in-out infinite; }
    .wfn .dot.queued { background: var(--bx-accent); opacity: .45; }
    .wfn .dot.blocked { background: var(--bx-yellow, #d9a441); }
    .wfn .dot.done { background: var(--bx-green); }
    .wfn .dot.error, .wfn .dot.cancelled { background: var(--bx-red); }
    @keyframes pulse { 50% { opacity: .3; } }
    .wfn .cost { font-family: var(--bx-mono); font-size: 10.5px; color: var(--bx-muted);
                 white-space: nowrap; justify-self: end; text-align: right; }
    /* Share-of-tree bar: an absolute number tells you nothing, a bar shows
       which node ate the budget. */
    .wfn .share { display: block; height: 2px; background: var(--bx-border); margin-top: 2px; }
    .wfn .share > i { display: block; height: 100%; background: var(--bx-accent); }
    /* Second line spans one column so it wraps under the title and can never
       widen the row. */
    .wfn .sub { grid-column: 1 / 2; font-size: 10.5px; color: var(--bx-muted);
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wfn .sub.blk { color: var(--bx-yellow, #d9a441); }
    .wfn .sub.bad { color: var(--bx-red); }
    .badge.wfchip { cursor: pointer; }

    /* Render pane — an in-flow split of .main, above the composer. The basis
       is clamp(px, vh, px) and never a %: .wrap is height:100vh with a
       min-height, so at short viewports the row height is indefinite and a %
       flex-basis collapses the pane to nothing. ⤢ hides the timeline when you
       want the whole column for the render. */
    .preview { display: flex; flex-direction: column; min-height: 0;
               flex: 0 1 clamp(120px, 40vh, 520px);
               border-top: 1px solid var(--bx-border); background: var(--bx-panel-2); }
    .preview[hidden] { display: none; }
    .main.prev-max #timeline { display: none; }
    .main.prev-max .preview { flex: 1 1 auto; }
    .preview .phd { display: flex; align-items: center; gap: 6px; padding: 5px 8px 5px 10px;
                    border-bottom: 1px solid var(--bx-border); font-size: 11.5px; }
    .preview .ppath { min-width: 40px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .preview .badge { color: var(--bx-muted); }
    .preview .pwarn { color: var(--bx-yellow, #d9a441); white-space: nowrap; overflow: hidden;
                      text-overflow: ellipsis; }
    .preview .pbody { flex: 1; min-height: 0; position: relative; }
    /* The frame is the only thing allowed to overflow: arbitrary model HTML
       scrolls inside its own viewport, so the tile never scrolls sideways.
       The white background and color-scheme are forced because arbitrary HTML
       assumes a light page — including the UA scrollbars and form controls. */
    .prevframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
                 display: block; background: #fff; color-scheme: light; }
    .prevframe[hidden] { display: none; }
    /* the live pane's status strip (live-status.js): what the page's URL answers, and Check */
    .lstrip { display: flex; align-items: center; gap: 8px; padding: 3px 8px 3px 10px; font-size: 11.5px;
              border-bottom: 1px solid var(--bx-border); color: var(--bx-muted); }
    .lstrip .lsout { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lstrip[data-tone=ok] .lsout { color: var(--bx-green); }
    .lstrip[data-tone=bad] .lsout { color: var(--bx-red); }
    .lsmsg { position: absolute; inset: 0; padding: 16px; font-size: 12.5px; color: var(--bx-muted); overflow: auto; }
    .lsmsg[hidden] { display: none; }

    /* render_html chip in the timeline. */
    .rchip { font-family: var(--bx-mono); font-size: 11.5px; cursor: pointer; padding: 1px 7px;
             border: 1px solid color-mix(in srgb, var(--bx-accent) 45%, var(--bx-border));
             border-radius: 5px; }
    .rchip:hover { border-color: var(--bx-accent); background: var(--bx-panel-2); }
    .rchip.on { background: color-mix(in srgb, var(--bx-accent) 16%, transparent); }

    /* ---- the chat (chat-cards.js) ---- */
    .muted.small, .small { font-size: 11.5px; }
    .center { text-align: center; margin: 6px 0; }
    .crumbs { font-size: 11.5px; color: var(--bx-muted); margin: 0 0 8px; }
    .crumbs a { cursor: pointer; color: var(--bx-accent); }
    .msg { margin: 8px 0; word-break: break-word; }
    .msg.user { margin-left: auto; max-width: 88%; width: fit-content; padding: 6px 11px; border-radius: 10px;
                background: color-mix(in srgb, var(--bx-accent) 11%, var(--bx-panel)); border: 1px solid color-mix(in srgb, var(--bx-accent) 30%, var(--bx-border)); }
    .msg.user .txt { white-space: pre-wrap; }
    .msg.user.other { margin-left: 0; margin-right: auto; background: var(--bx-panel-2); border-color: var(--bx-border); }
    .msg.user .who { font-size: 10.5px; color: var(--bx-muted); margin-bottom: 2px; }
    .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
    /* a streamed answer is written a top-level block at a time (chat-md.js mdInto) */
    .md-b { display: contents; }
    .md > .md-b:first-child > :first-child { margin-top: 0; } .md > .md-b:last-child > :last-child { margin-bottom: 0; }
    /* a long chat (chat-window.js): more above the window; the pill back to the latest */
    .earlier { margin: 0 0 6px; }
    .jumpw { position: sticky; bottom: 0; height: 0; display: flex; justify-content: center; align-items: flex-start; overflow: visible; z-index: 2; }
    .jump { transform: translateY(calc(-100% - 8px)); white-space: nowrap; font: inherit; font-size: 12px; cursor: pointer;
            padding: 4px 12px; border-radius: 999px; border: 1px solid var(--bx-accent); background: var(--bx-panel);
            color: var(--bx-accent); box-shadow: 0 2px 8px rgba(0, 0, 0, .25); }
    .jump:hover { background: var(--bx-accent); color: var(--bx-bg); }
    .md p, .md ul, .md ol, .md blockquote { margin: 5px 0; }
    .md ul, .md ol { padding-left: 22px; }
    .md h1, .md h2, .md h3, .md h4 { margin: 8px 0 3px; font-size: 14px; }
    .md h1 { font-size: 16px; } .md h2 { font-size: 15px; }
    .md code { font-family: var(--bx-mono); font-size: 12px; background: var(--bx-panel-2); border: 1px solid var(--bx-border); border-radius: 4px; padding: 0 4px; }
    .md pre { background: var(--bx-panel-2); border: 1px solid var(--bx-border); border-radius: 6px; padding: 7px 9px; margin: 5px 0; overflow-x: auto; }
    .md pre code { background: none; border: 0; padding: 0; white-space: pre; }
    .md blockquote { border-left: 3px solid var(--bx-border); padding-left: 9px; color: var(--bx-muted); }
    .md table { border-collapse: collapse; margin: 5px 0; display: block; overflow-x: auto; }
    .md th, .md td { border: 1px solid var(--bx-border); padding: 2px 8px; font-size: 12.5px; }
    .md a { color: var(--bx-accent); text-decoration: underline; }
    .md hr { border: 0; border-top: 1px solid var(--bx-border); margin: 8px 0; }
    .cur { display: inline-block; width: 6px; height: 13px; background: var(--bx-accent); margin-left: 2px;
           vertical-align: text-bottom; animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .spin { display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 50%;
            border: 2px solid color-mix(in srgb, var(--bx-accent) 30%, transparent); border-top-color: var(--bx-accent);
            animation: spin .8s linear infinite; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* thinking: a quiet fold; open (with a shimmer) while it streams */
    .think { margin: 6px 0; font-size: 12px; color: var(--bx-muted); }
    .think .th { cursor: pointer; user-select: none; display: inline-flex; gap: 5px; }
    .think.live .th { background: linear-gradient(90deg, var(--bx-muted) 20%, var(--bx-text) 50%, var(--bx-muted) 80%);
                      background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
                      animation: shimmer 1.6s linear infinite; }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .think .tb { white-space: pre-wrap; border-left: 2px solid var(--bx-border); padding: 2px 0 2px 10px; margin-top: 3px;
                 font-style: italic; max-height: 320px; overflow: auto; }
    .tw { color: var(--bx-muted); font-size: 10px; width: 10px; display: inline-block; }
    /* tool and subagent cards */
    .tcard, .acard { border: 1px solid var(--bx-border); border-radius: 7px; margin: 5px 0; background: var(--bx-panel-2); min-width: 0; }
    .tch, .ach { display: flex; align-items: center; gap: 7px; padding: 4px 9px; cursor: pointer; min-width: 0; font-size: 12.5px; }
    .tch:hover, .ach:hover { background: var(--bx-panel); border-radius: 7px; }
    .tch .ic, .ach .ic { flex: none; width: 18px; text-align: center; color: var(--bx-muted); font-family: var(--bx-mono); font-size: 11px; }
    .tch .hl, .ach .hl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tch .st, .ach .st { flex: none; font-size: 10.5px; color: var(--bx-muted); }
    /* a sandbox call (model/tool-heads.js subline, outcome): its command, what it came to */
    .tch .sub { margin-left: 8px; color: var(--bx-muted); font-family: var(--bx-mono); font-size: 11px; }
    .tch .oc { flex: none; font-size: 10.5px; font-family: var(--bx-mono); color: var(--bx-muted); }
    .tch .oc.ok { color: var(--bx-green); }
    .tch .oc.bad { color: var(--bx-red); }
    .tch .oc.run { color: var(--bx-accent); }
    .tcard.error { border-color: color-mix(in srgb, var(--bx-red) 45%, var(--bx-border)); }
    .tcard.error .st { color: var(--bx-red); }
    .tcard.approval, .acard.approval { border-color: color-mix(in srgb, var(--bx-yellow, #d9a441) 55%, var(--bx-border)); }
    .tcard.stopped .hl { color: var(--bx-muted); text-decoration: line-through; }
    .tcb { padding: 2px 10px 8px 34px; font-size: 12px; }
    .tname { font-size: 10.5px; color: var(--bx-muted); margin-bottom: 3px; }
    .args { display: grid; gap: 2px; }
    .arg { display: grid; grid-template-columns: minmax(60px, auto) 1fr; gap: 8px; min-width: 0; }
    .arg .k { color: var(--bx-muted); font-family: var(--bx-mono); font-size: 11px; }
    .arg .v { min-width: 0; overflow-wrap: anywhere; }
    .arg pre.v, .res pre { margin: 0; font-family: var(--bx-mono); font-size: 11.5px; white-space: pre-wrap; word-break: break-word;
                           background: var(--bx-panel); border: 1px solid var(--bx-border); border-radius: 5px; padding: 5px 7px;
                           max-height: 320px; overflow: auto; }
    .res { margin-top: 6px; }
    .lnk { border: 0; background: none; color: var(--bx-accent); cursor: pointer; font: inherit; font-size: 11px; padding: 0 2px; }
    .acard { border-left: 3px solid color-mix(in srgb, var(--bx-accent) 60%, var(--bx-border)); }
    .acard.done { border-left-color: var(--bx-green); }
    .acard.error, .acard.stopped { border-left-color: var(--bx-red); }
    .ach .rid { font-family: var(--bx-mono); font-size: 10.5px; color: var(--bx-muted); }
    .acb { padding: 0 10px 8px 16px; border-top: 1px dashed var(--bx-border); }
    .acb .task { font-size: 11.5px; color: var(--bx-muted); margin: 6px 0; cursor: pointer;
                 display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .acb .task.on { display: block; white-space: pre-wrap; }
    .acb .answer { margin-top: 6px; border-top: 1px solid var(--bx-border); padding-top: 5px; }
    .k { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--bx-muted); margin-right: 5px; }
    .notice { font-size: 12px; color: var(--bx-muted); margin: 5px 0; }
    .notice .nh { cursor: pointer; }
    .notice .nb { white-space: pre-wrap; border-left: 2px solid var(--bx-border); padding-left: 10px; margin-top: 3px; }
    .step { font-size: 11.5px; color: var(--bx-muted); margin: 3px 0; overflow-wrap: anywhere; }
    .step.error { color: var(--bx-red); }
    .step .g { display: inline-block; width: 16px; text-align: center; }
    .step.md-step { display: flex; align-items: baseline; }
    .step.md-step .md { flex: 1; min-width: 0; color: var(--bx-text); font-size: 13px; }
    .step .steplnk { font-size: inherit; padding: 0; text-align: left; overflow-wrap: anywhere; }
    .activity { font-size: 12px; color: var(--bx-muted); margin: 8px 0 2px; display: flex; gap: 7px; align-items: center; }
    .activity.warn { color: var(--bx-yellow, #d9a441); }
    .ask ul { margin: 4px 0 6px; padding-left: 20px; }
    .anote { margin: -2px 0 8px; padding: 0 2px; }
    /* queued messages: a strip above the composer, each removable until delivered */
    .queue { flex: none; display: flex; flex-wrap: wrap; gap: 5px; padding: 6px 12px 0; border-top: 1px solid var(--bx-border); }
    .queue[hidden] { display: none; }
    .queue + .attach, .queue + .attach + .composer, .queue + .composer { border-top: 0; }
    .qchip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; font-size: 11.5px; padding: 1px 4px 1px 8px;
             border: 1px dashed var(--bx-accent); border-radius: 999px; background: var(--bx-panel); }
    .qchip .ql { font-size: 9.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--bx-accent); }
    .qchip .qt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40ch; }
    .qchip button { border: 0; background: none; color: var(--bx-muted); cursor: pointer; padding: 0 3px; font: inherit; }
    .qchip button:hover { color: var(--bx-red); }
    .run .m .spin { width: 8px; height: 8px; }
    /* Settings panel — overlays the run view (timeline+composer) when open. */
    .settings { position: absolute; inset: 0; background: var(--bx-panel); display: flex; flex-direction: column; z-index: 5; }
    .settings[hidden] { display: none; }
    .tabs { display: flex; gap: 2px; padding: 6px 8px; border-bottom: 1px solid var(--bx-border);
            background: var(--bx-panel-2); align-items: center; flex-wrap: wrap; }
    .tab { background: transparent; border: 1px solid transparent; border-radius: 5px; color: var(--bx-muted);
           font: inherit; font-size: 12px; font-weight: 600; padding: 4px 10px; cursor: pointer; }
    .tab:hover { color: var(--bx-text); background: var(--bx-panel); }
    .tab.on { color: var(--bx-text); background: var(--bx-panel); border-color: var(--bx-border); }
    .settings-bd { overflow: auto; flex: 1; padding: 12px 14px; }
    .sec { margin-bottom: 16px; }
    .sec > h4 { margin: 0 0 7px; font-size: 10.5px; font-weight: 600; letter-spacing: .08em;
                text-transform: uppercase; color: var(--bx-muted); display: flex; align-items: center; gap: 8px; }
    .grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
    .chk { display: flex; align-items: center; gap: 7px; font-size: 12.5px; padding: 3px 0; }
    .chk input[type=checkbox] { accent-color: var(--bx-accent); width: 15px; height: 15px; flex: none; }
    .hint { color: var(--bx-muted); font-size: 11.5px; margin: 5px 0 0; }
    .err { color: var(--bx-red); font-size: 12px; }
    .card { border: 1px solid var(--bx-border); border-radius: 6px; padding: 8px 10px; margin-bottom: 7px; background: var(--bx-panel-2); }
    .card .ch { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .card .ch .nm { font-weight: 600; flex: 1; min-width: 80px; }
    .kv { display: grid; grid-template-columns: 150px 1fr auto; gap: 6px; align-items: center; margin-bottom: 5px; }
    .kv .mono { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tblwrap { overflow-x: auto; }
    table.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
    table.tbl th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
                   color: var(--bx-muted); font-weight: 600; padding: 3px 8px 3px 0; }
    table.tbl td { padding: 4px 8px 4px 0; border-top: 1px solid var(--bx-border); vertical-align: top; }

    dialog { background: var(--bx-panel); color: var(--bx-text); border: 1px solid var(--bx-border);
             border-radius: 8px; padding: 0; width: min(520px, 92vw); }
    dialog::backdrop { background: rgba(0,0,0,.5); }
    .dlg-hd { padding: 10px 14px; border-bottom: 1px solid var(--bx-border); font-weight: 600; }
    .dlg-bd.share { min-width: min(460px, 86vw); }
    .share .chk { display: block; margin: 3px 0; }
    .share .prow { display: flex; gap: 6px; align-items: center; margin: 4px 0; font-size: 12.5px; }
    .share .prow .mono { flex: 1; }
    .share .prow.add input { flex: 1; }
    .share .linkout { width: 100%; box-sizing: border-box; margin-top: 6px; font-size: 11.5px; }
    .dlg-bd { padding: 12px 14px; display: grid; gap: 8px; max-height: 70vh; overflow: auto; }
    .dlg-ft { padding: 10px 14px; border-top: 1px solid var(--bx-border); display: flex; gap: 8px; justify-content: flex-end; }
    .field label { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: .05em;
                   text-transform: uppercase; color: var(--bx-muted); margin-bottom: 2px; }
    .field input, .field textarea, .field select { width: 100%; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .empty { color: var(--bx-muted); padding: 24px; text-align: center; }

    /* Home (no run selected): greeting + recent quick asks. */
    .home { max-width: 640px; margin: 0 auto; padding: 26px 16px 12px; }
    .home .hi { font-size: 17px; font-weight: 650; margin-bottom: 3px; }
    .home .sub { color: var(--bx-muted); font-size: 12.5px; margin-bottom: 16px; }
    .home .exs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
    .home .ex { font-size: 11.5px; color: var(--bx-muted); border: 1px solid var(--bx-border);
                border-radius: 999px; padding: 3px 10px; cursor: pointer; background: var(--bx-panel-2); }
    .home .ex:hover { color: var(--bx-text); border-color: var(--bx-accent); }
    .home h5 { margin: 0 0 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .08em;
               text-transform: uppercase; color: var(--bx-muted); }
    .qa { border: 1px solid var(--bx-border); border-radius: 7px; padding: 8px 11px; margin-bottom: 7px;
          background: var(--bx-panel-2); cursor: pointer; }
    .qa:hover { border-color: var(--bx-accent); }
    .qa .q { font-weight: 600; font-size: 12.5px; display: flex; gap: 7px; align-items: center; }
    .qa .q .when { font-weight: 400; color: var(--bx-muted); font-size: 10.5px; margin-left: auto; white-space: nowrap; }
    .qa .a { color: var(--bx-muted); font-size: 12px; margin-top: 3px; white-space: pre-wrap;
             display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .brand { cursor: pointer; }
    .brand:hover { color: var(--bx-text); }
  </style>
</head>
<body class="bx">
  <div class="wrap">
    <div class="side">
      <div class="hd"><b class="brand" id="home" title="Home — what needs you">⌂ Home</b>
        <button class="btn ghost btnsm" id="gear" title="Settings">⚙</button>
        <!-- The brake lives here, not in .main: .settings overlays .main but
             never .side, so it stays one click away from every view state. -->
        <button class="btn rm btnsm" id="halt" title="Stop every running agent now" hidden>⏻</button>
      </div>
      <div class="sq"><div class="newrow"><button class="btn btnsm" id="new" title="New chat">New chat</button>
        <button class="btn ghost btnsm" id="newopts" title="New chat with options: a title, instructions, the tool mode">⋯</button></div>
        <input id="csearch" type="search" placeholder="Search conversations…" autocomplete="off"></div>
      <div id="autos"></div>
      <div class="views" id="views"></div>
      <div class="runs" id="runs"></div>
    </div>
    <div class="main" id="main">
      <div class="top" id="top"></div>
      <div class="timeline" id="timeline"></div>

      <!-- Workflow view. A SIBLING of #timeline that takes the SAME flex slot:
           the two are alternatives, never both, so the geometry above the
           composer is byte-identical to today and every assertion in
           test/layout.mjs still holds. NOT an overlay like .settings, because
           the loop is watch-the-tree-and-steer-the-parent and an overlay would
           cover the composer. -->
      <div class="wfpane" id="workflow" hidden>
        <div class="wfhd">
          <span class="wft" id="wf-title"></span>
          <span class="badge" id="wf-counts"></span>
          <span style="flex:1"></span>
          <span class="wfcost mono" id="wf-cost"></span>
          <button class="btn rm btnsm" id="wf-stop" title="Cancel this workflow and everything below it">Stop</button>
          <button class="btn ghost btnsm" id="wf-close" title="Back to the timeline (Esc)">✕</button>
        </div>
        <div class="wfbody" id="wf-body"></div>
      </div>

      <!-- Render pane (render_html). A SIBLING of #timeline, never a child:
           loadDetail() rebuilds #timeline.innerHTML on every poll tick and its
           change key includes the streaming draft, so an iframe in there would
           be torn down and rebuilt on every streamed token. It is also NOT an
           overlay like .settings — that would cover the composer, and the whole
           loop is "look at the render, ask for a change, look again".
           The <iframe> is static markup, created once at page load; JS only
           ever assigns its .srcdoc property. sandbox="" is the entire isolation
           story for untrusted model HTML: no scripts, no forms, no navigation,
           opaque origin. frameDoc() adds a meta CSP on top, because sandbox=""
           still permits subresource LOADS (a remote <img> would beacon). -->
      <div class="preview" id="preview" hidden>
        <div class="phd">
          <span id="prev-icon">🖼</span>
          <span class="ppath mono" id="prev-path"></span>
          <span class="badge" id="prev-ver"></span>
          <span class="pwarn" id="prev-warn" hidden></span>
          <span style="flex:1"></span>
          <button class="btn ghost btnsm" id="prev-reload" title="Reload the live page" hidden>↻ Reload</button>
          <button class="btn ghost btnsm" id="prev-src" title="Open this file in the Files tab">Source</button>
          <button class="btn ghost btnsm" id="prev-max" title="Maximize / restore">⤢</button>
          <button class="btn ghost btnsm" id="prev-close" title="Close (Esc)">✕</button>
        </div>
        <div class="pbody">
          <iframe id="prevframe" class="prevframe" sandbox="" referrerpolicy="no-referrer"
                  title="rendered output — static, no scripts"></iframe>
        </div>
      </div>

      <div class="queue" id="queue" hidden></div>
      <div class="attach" id="attach" hidden></div>
      <div class="composer">
        <span class="cpicks" id="cpicks">
          <span class="clspick apick" id="apick" hidden></span>
          <span class="clspick" id="cpick" hidden></span>
          <select class="msel" id="msel" title="the model" hidden></select>
          <select class="msel ssel" id="ssel" title="the coding sandbox" hidden></select>
        </span>
        <span class="cinput">
          <button class="btn ghost" id="clip" title="Attach files (or drop / paste them) — they land in the run's session files">📎</button>
          <input type="file" id="clipin" multiple hidden>
          <textarea id="msg" rows="1" placeholder="ask anything…" autocomplete="off"></textarea>
          <button class="btn rm" id="stop" title="Stop the agent — messages still queued come back here" hidden>Stop</button>
          <button class="btn" id="send">Send</button>
        </span>
      </div>

      <!-- Tabbed settings, overlaying the run view. -->
      <div class="settings" id="settings" hidden>
        <div class="tabs" id="tabs">
          <button class="tab on" data-tab="config">Config</button>
          <button class="tab" data-tab="features">Features</button>
          <button class="tab" data-tab="classes">Classes</button>
          <button class="tab" data-tab="harnesses">Coding agents</button>
          <button class="tab" data-tab="memory">Memory</button>
          <button class="tab" data-tab="files">Files</button>
          <button class="tab" data-tab="skills">Skills</button>
          <button class="tab" data-tab="mcp">MCP</button>
          <span style="flex:1"></span>
          <button class="tab" id="settings-close" title="Close settings">✕</button>
        </div>
        <div class="settings-bd" id="sbd"></div>
      </div>
    </div>
  </div>

  <dialog id="newdlg">
    <form method="dialog">
      <div class="dlg-hd">New chat</div>
      <div class="dlg-bd">
        <div class="field"><label>First message</label><textarea id="n-goal" rows="3" placeholder="what should the agent do?"></textarea></div>
        <div class="field"><label>Class — fixed once it starts</label><select id="n-class"></select></div>
        <div id="n-ext" style="display:contents"></div>
        <div class="field"><label>Title (optional)</label><input id="n-title"></div>
        <div class="field"><label>Instructions — replaces the system prompt (optional)</label><textarea id="n-system" rows="3"></textarea></div>
      </div>
      <div class="dlg-ft"><button class="btn ghost" value="cancel">Cancel</button><button class="btn" id="n-create" value="ok">Start</button></div>
    </form>
  </dialog>

  <!-- the Sandboxes dialog and the terminal pane (sandboxes.js draws them) -->
  <dialog id="sbxdlg" class="sbxdlg"></dialog>
  <div id="sbxterm"></div>

  <script type="module" src="agent.js"></script>
</body>
</html>
