<!doctype html>
<!-- data-bx-theme="auto": the page follows the person's light or dark theme;
     its styles use theme.css's tokens only, its status icons
     /vendor/bx-icons.js (docs/frontend-kit.md). -->
<html lang="en" data-bx-theme="auto">
<head>
  <meta charset="utf-8">
  <title>email</title>
  <link rel="stylesheet" href="/vendor/theme.css">
  <style>
    body { padding: var(--bx-pad); }
    h3 { margin: 0 0 4px; font: var(--bx-font-title); }
    .cal { background: var(--bx-panel-2); border: 1px solid var(--bx-border);
           border-radius: var(--bx-radius); padding: 8px 12px; margin-top: 8px; }
    .cal h4 { margin: 0 0 4px; font: var(--bx-font-micro); letter-spacing: var(--bx-tracking-micro);
              text-transform: uppercase; color: var(--bx-muted); }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: 2px 0; display: flex; gap: 8px; align-items: baseline; }
    li b { font: var(--bx-font-code); font-weight: 600; }
    .empty { color: var(--bx-muted); }
    .denied { color: var(--bx-danger); }
  </style>
</head>
<body class="bx">
  <h3>inbox (demo)</h3>
  <div class="empty">no mail — this demo exists for the calendar widget below</div>
  <div class="cal">
    <h4>TODAY FROM apps/calendar</h4>
    <ul id="today"><li class="empty">loading…</li></ul>
  </div>
  <script type="module">
    import '/vendor/bx-icons.js'; // <bx-icon name>: the workspace's drawn glyphs
    const el = document.getElementById('today');
    const load = async () => {
      // Server-side path: our backend calls calendar with our identity.
      const r = await xbin.fetch(`/api/${xbin.self}/today`);
      if (!r.ok) {
        const e = await r.json().catch(() => ({}));
        el.innerHTML = `<li class="denied"><bx-icon name="error"></bx-icon>${e.error ?? r.status} — approve the grant on the root page</li>`;
        return;
      }
      const d = await r.json();
      el.innerHTML = d.events.length === 0 ? '<li class="empty">nothing today</li>'
        : d.events.map((e) => `<li><b>${e.time || '--:--'}</b> ${e.title}</li>`).join('');
    };
    // Live badge update when calendar changes (needs the bus grant).
    xbin.bus.on('res:apps/calendar/bus/events/', load);
    await load();
  </script>
</body>
</html>
