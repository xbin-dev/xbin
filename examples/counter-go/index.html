<!doctype html>
<!-- data-bx-theme="auto": the page follows the person's light or dark theme;
     its styles use theme.css's tokens only (docs/frontend-kit.md). -->
<html lang="en" data-bx-theme="auto">
<head>
  <meta charset="utf-8">
  <title>counter</title>
  <link rel="stylesheet" href="/vendor/theme.css">
  <style>
    body { padding: var(--bx-pad); display: flex; align-items: center; gap: 12px; }
    #n { font: var(--bx-font-heading); font-variant-numeric: tabular-nums; min-width: 3ch; }
  </style>
</head>
<body class="bx">
  <span id="n">…</span>
  <button id="inc" class="primary">+1</button>
  <script type="module">
    // xbin.fetch attributes this call to examples/counter-go (its own API —
    // always allowed). Other elements calling it need a grant. See /docs/auth.md.
    const n = document.getElementById('n');
    const load = async () =>
      { n.textContent = (await (await xbin.fetch(`/api/${xbin.self}/count`)).json()).count; };
    document.getElementById('inc').onclick = async () => {
      await xbin.fetch(`/api/${xbin.self}/count`, { method: 'POST' });
      await load();
    };
    await load();
  </script>
</body>
</html>
