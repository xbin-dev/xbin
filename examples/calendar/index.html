<!doctype html>
<!-- data-bx-theme="auto": the page follows the person's light or dark theme.
     body.bx gives it theme.css's type, controls (.primary is the accent
     button) and focus ring; its own styles use the tokens only
     (docs/frontend-kit.md). -->
<html lang="en" data-bx-theme="auto">
<head>
  <meta charset="utf-8">
  <title>calendar</title>
  <link rel="stylesheet" href="/vendor/theme.css">
  <style>
    body { padding: var(--bx-pad); }
    h3 { margin: 0 0 8px; font: var(--bx-font-micro); letter-spacing: var(--bx-tracking-micro);
         text-transform: uppercase; color: var(--bx-muted); }
    ul { list-style: none; padding: 0; margin: 0 0 12px; }
    li { min-height: var(--bx-row); display: flex; align-items: center; gap: 8px;
         border-bottom: 1px solid var(--bx-border); }
    li:last-child { border-bottom: 0; }
    li b { font: var(--bx-font-code); font-weight: 600; }
    form { display: flex; gap: 8px; }
    input[name=title] { flex: 1; }
    .empty { color: var(--bx-muted); }
  </style>
</head>
<body class="bx">
  <h3>today</h3>
  <ul id="list"><li class="empty">loading…</li></ul>
  <form id="add">
    <input name="time" placeholder="HH:MM" size="5">
    <input name="title" placeholder="new event" required>
    <button class="primary">add</button>
  </form>
  <script type="module">
    const list = document.getElementById('list');
    const load = async () => {
      const d = await (await xbin.fetch(`/api/${xbin.self}/events`)).json();
      list.innerHTML = d.events.length === 0 ? '<li class="empty">nothing today</li>'
        : d.events.map((e) => `<li><b>${e.time || '--:--'}</b> ${e.title}</li>`).join('');
    };
    document.getElementById('add').onsubmit = async (ev) => {
      ev.preventDefault();
      const f = new FormData(ev.target);
      await xbin.fetch(`/api/${xbin.self}/events`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          day: new Date().toISOString().slice(0, 10),
          time: f.get('time'), title: f.get('title'),
        }),
      });
      ev.target.reset();
    };
    // Live updates from our own bus (also how other apps stay in sync).
    // Own resources go through xbin.self — never hardcode your install path,
    // so a clone/fork of this tile keeps working (AGENTS.md).
    xbin.bus.on(`res:${xbin.self}/bus/events/`, load);
    await load();
  </script>
</body>
</html>
