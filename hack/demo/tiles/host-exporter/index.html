<!doctype html>
<!-- Host exporter: what /metrics serves right now (the metrics dashboard
     scrapes it every few seconds). -->
<html lang="en" data-bx-theme="auto">
<head>
  <meta charset="utf-8">
  <title>Host exporter</title>
  <link rel="stylesheet" href="/vendor/theme.css">
  <style>
    html, body { margin: 0; height: 100%; }
    body { display: grid; grid-template-rows: auto 1fr; }
    header { display: flex; align-items: baseline; gap: 10px; padding: 12px 16px 8px; border-bottom: 1px solid var(--bx-border); }
    header b { font: var(--bx-font-title); }
    header span { font: var(--bx-font-meta); color: var(--bx-muted); }
    /* the exposition text, highlighted like code: help and type lines as
       comments, a sample's name, its labels and its value */
    pre { margin: 0; padding: 12px 16px; overflow: auto; font: var(--bx-font-code); background: var(--bx-code-bg); color: var(--bx-text); }
    pre .c { color: var(--bx-syn-comment); }
    pre .l { color: var(--bx-syn-attr); }
    pre .v { color: var(--bx-syn-number); }
  </style>
</head>
<body class="bx">
  <header><b>Host exporter</b><span id="st">reading…</span></header>
  <pre id="out"></pre>
  <script type="module">
    const out = document.getElementById('out'), st = document.getElementById('st');
    const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    async function tick() {
      try {
        const [text, s] = await Promise.all([
          xbin.fetch(`/api/${xbin.self}/metrics`).then((r) => r.text()),
          xbin.fetch(`/api/${xbin.self}/status`).then((r) => r.json())]);
        out.innerHTML = text.split('\n').map((l) => l.startsWith('#') ? `<span class="c">${esc(l)}</span>`
          : esc(l).replace(/^([^\s{]+)(\{[^}]*\})?\s(.+)$/, (_, n, lb, v) => `${n}${lb ? `<span class="l">${lb}</span>` : ''} <span class="v">${v}</span>`)).join('\n');
        st.textContent = `${s.host} · ${s.scrapes} scrapes served`;
      } catch (e) { st.textContent = String(e.message || e); }
    }
    tick(); setInterval(tick, 3000);
  </script>
</body>
</html>
