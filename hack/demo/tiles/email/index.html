<!doctype html>
<!-- The team inbox: examples/email's backend (GET /today reads apps/calendar
     with this tile's own grant) plus an inbox kept in the tile's `mail` kv
     resource. The demo film set lays this page over the example's own. -->
<html lang="en" data-bx-theme="auto">
<head>
  <meta charset="utf-8">
  <title>email</title>
  <link rel="stylesheet" href="/vendor/theme.css">
  <style>html, body { margin: 0; height: 100%; }</style>
</head>
<body class="bx">
  <team-inbox></team-inbox>
  <script type="module">
    import { LitElement, html, css, nothing } from 'lit';
    import { scrollCss } from '/vendor/scroll-css.js';

    const MAIL = `res:${xbin.self}/mail`;
    const kv = (k) => `/api/xbin/kv/${MAIL}/${k}`;
    const DAY = 864e5;
    const when = (t) => {
      const d = new Date(t), now = new Date();
      if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      if (now - d < 6 * DAY) return d.toLocaleDateString('en-US', { weekday: 'short' });
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    };
    const initials = (n) => String(n || '?').split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
    const last = (t) => t.messages[t.messages.length - 1];

    class TeamInbox extends LitElement {
      static properties = { _threads: { state: true }, _sel: { state: true }, _folder: { state: true }, _today: { state: true }, _dayName: { state: true }, _err: { state: true }, _replying: { state: true } };
      static styles = [scrollCss, css`
        :host { display: grid; grid-template-columns: 184px minmax(240px, 300px) 1fr; height: 100%; font: var(--bx-font); color: var(--bx-text); background: var(--bx-panel); }
        * { box-sizing: border-box; }
        ::selection { background: var(--bx-selection); color: var(--bx-selection-text); }
        ::placeholder { color: var(--bx-subtle); opacity: 1; }
        :focus-visible { outline: var(--bx-focus-outline); outline-offset: var(--bx-focus-offset); box-shadow: var(--bx-focus-halo); }
        nav { border-right: 1px solid var(--bx-border); padding: 12px 8px; overflow: auto; background: var(--bx-panel-2); }
        .label { font: var(--bx-font-micro); letter-spacing: var(--bx-tracking-micro); text-transform: uppercase; color: var(--bx-muted); }
        .muted { color: var(--bx-muted); }
        .box { padding: 0 8px 8px; }
        /* folders and threads: a selected row on the selection, with the accent rule */
        .f { display: flex; align-items: center; justify-content: space-between; min-height: var(--bx-row); padding: 0 8px; border-radius: var(--bx-radius); cursor: pointer; }
        .f:hover { background: var(--bx-hover); }
        .f.on { background: var(--bx-selection); color: var(--bx-selection-text); box-shadow: inset 2px 0 0 var(--bx-accent); font-weight: 600; }
        .f b { font: var(--bx-font-meta); font-weight: 600; font-variant-numeric: tabular-nums; }
        .today { margin-top: 16px; padding: 8px; border-radius: var(--bx-radius); background: var(--bx-panel); border: 1px solid var(--bx-border); }
        .today h4 { margin: 0 0 6px; }
        .today div { padding: 2px 0; line-height: 1.35; }
        .today b { font: var(--bx-font-meta); font-family: var(--bx-mono); margin-right: 6px; }
        .today .src { margin-top: 6px; font: var(--bx-font-meta); color: var(--bx-muted); }
        .list { border-right: 1px solid var(--bx-border); overflow: auto; }
        .th { padding: 8px 12px 8px 20px; border-bottom: 1px solid var(--bx-border); cursor: pointer; position: relative; }
        .th:hover { background: var(--bx-hover); }
        .th.on { background: var(--bx-selection); color: var(--bx-selection-text); box-shadow: inset 2px 0 0 var(--bx-accent); }
        .th .row { display: flex; gap: 6px; align-items: baseline; }
        .th .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .th.unread .who, .th.unread .s { font-weight: 600; }
        .th .t { font: var(--bx-font-meta); color: var(--bx-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
        .th .s { margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .th .p { color: var(--bx-muted); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        /* unread: the subject in weight, and a square */
        .th.unread::before { content: ''; position: absolute; left: 8px; top: 14px; width: 6px; height: 6px; background: currentColor; }
        .read { overflow: auto; padding: 16px 20px 24px; }
        .read h2 { margin: 0 0 6px; font: var(--bx-font-title); }
        .labels { margin-bottom: 12px; display: flex; gap: 6px; }
        .badge { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border: 1px solid var(--bx-border); border-radius: var(--bx-radius);
                 font: var(--bx-font-micro); letter-spacing: var(--bx-tracking-micro); text-transform: uppercase; color: var(--bx-muted); white-space: nowrap; }
        .msg { border: 1px solid var(--bx-border); border-radius: var(--bx-radius); padding: 12px 14px; margin-bottom: 10px; background: var(--bx-panel-2); }
        .mh { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
        /* a person: initials on concrete, square */
        .av { display: inline-grid; place-items: center; flex: none; width: 32px; height: 32px; border-radius: var(--bx-radius);
              background: var(--bx-panel); border: 1px solid var(--bx-border); color: var(--bx-text); font-weight: 600; }
        .mh .n { font-weight: 600; }
        .mh .e { font: var(--bx-font-meta); color: var(--bx-muted); }
        .mh .t { margin-left: auto; font: var(--bx-font-meta); color: var(--bx-muted); white-space: nowrap; align-self: flex-start; }
        .body { white-space: pre-wrap; font: var(--bx-font-body); }
        .reply { display: flex; gap: 8px; }
        .reply button { display: inline-flex; align-items: center; gap: 6px; min-height: var(--bx-control-h); padding: 4px 12px; font: inherit; font-weight: 600;
                        color: var(--bx-text); background: var(--bx-panel); border: 1px solid var(--bx-border-strong); border-radius: var(--bx-radius); cursor: pointer; }
        .reply button:hover { background: var(--bx-hover); }
        .reply button.send { background: var(--bx-accent); border-color: var(--bx-accent); color: var(--bx-accent-ink); }
        .reply button.send:hover { background: var(--bx-accent-hover); border-color: var(--bx-accent-hover); }
        textarea { width: 100%; min-height: 110px; resize: vertical; background: var(--bx-panel); border: 1px solid var(--bx-border-strong); border-radius: var(--bx-radius);
                   color: var(--bx-text); font: var(--bx-font-body); padding: 8px 10px; margin-bottom: 8px; }
        .empty { color: var(--bx-muted); padding: 32px; text-align: center; }
        /* a phone: the thread list alone, full width */
        @media (max-width: 560px) {
          :host { grid-template-columns: minmax(0, 1fr); }
          nav, .read { display: none; }
          .list { border-right: 0; }
        }
      `];

      constructor() { super(); this._threads = []; this._folder = 'Inbox'; }
      connectedCallback() {
        super.connectedCallback();
        this._load();
        this._loadToday();
        xbin.bus.on('res:apps/calendar/bus/events/', () => this._loadToday());
      }
      async _load() {
        try {
          const r = await xbin.fetch(`/api/xbin/kv/${MAIL}/?prefix=thread/`);
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          const { keys } = await r.json();
          const ts = (await Promise.all((keys || []).map(async (k) => { const v = await xbin.fetch(kv(k)); return v.ok ? v.json() : null; }))).filter(Boolean);
          ts.sort((a, b) => last(b).at - last(a).at);
          this._threads = ts;
          this._sel ??= ts[0]?.id;
        } catch (e) { this._err = `Couldn't open the inbox: ${e.message}`; }
      }
      // the example's server-side path: our backend calls apps/calendar with
      // our identity. On a weekend, the working day just ended — Friday, the
      // day a set seeded then is dated (hack/demo/clock.py) and the one the
      // calendar shows — from the calendar's own API (as the person reading,
      // who can see it). Our backend may still be starting (its Go build, on
      // a fresh set): a failed read is tried again, not left as "—".
      async _loadToday(tries = 0) {
        const t = new Date(), back = t.getDay() === 6 ? 1 : t.getDay() === 0 ? 2 : 0;
        let r = null;
        try {
          if (back) {
            const d = new Date(t); d.setDate(d.getDate() - back);
            const day = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            r = await xbin.fetch(`/api/apps/calendar/events?day=${day}`);
            if (r.ok) this._dayName = d.toLocaleDateString('en-US', { weekday: 'long' });
          }
          if (!r?.ok) r = await xbin.fetch(`/api/${xbin.self}/today`);
          if (r.ok) {
            this._today = (await r.json()).events.sort((a, b) => (a.time || '').localeCompare(b.time || ''));
            return;
          }
        } catch { /* not answering yet */ }
        if (tries < 40) setTimeout(() => this._loadToday(tries + 1), 1500);
      }
      async _send(t) {
        const body = this.renderRoot.querySelector('textarea')?.value.trim();
        if (!body) return;
        const me = (await (await xbin.fetch('/api/xbin/whoami')).json()).user || {};
        const to = [...t.messages].reverse().find((m) => !m.from.email.endsWith('@larkspan.example'))?.from.email || last(t).to;
        t.messages.push({ from: { name: me.name || 'Larkspan', email: `${me.id || 'hello'}@larkspan.example` }, to, at: Date.now(), body });
        this._replying = false;
        this._threads = [...this._threads].sort((a, b) => last(b).at - last(a).at);
        await xbin.fetch(kv(`thread/${t.id}`), { method: 'PUT', body: JSON.stringify(t) });
      }
      async _open(t) {
        this._sel = t.id; this._replying = false;
        if (t.unread) {
          t.unread = false;
          this.requestUpdate();
          await xbin.fetch(kv(`thread/${t.id}`), { method: 'PUT', body: JSON.stringify(t) });
        }
      }
      render() {
        const folders = ['Inbox', 'Customers', 'Internal', 'Events'];
        const shown = this._threads.filter((t) => this._folder === 'Inbox' || t.labels?.includes(this._folder));
        const t = this._threads.find((x) => x.id === this._sel);
        const unread = (f) => this._threads.filter((x) => x.unread && (f === 'Inbox' || x.labels?.includes(f))).length;
        return html`
          <nav>
            <div class="box label">Team inbox</div>
            ${folders.map((f) => html`<div class="f ${this._folder === f ? 'on' : ''}" @click=${() => { this._folder = f; }}><span>${f}</span>${unread(f) ? html`<b>${unread(f)}</b>` : nothing}</div>`)}
            <div class="today"><h4 class="label">${this._dayName || 'Today'}</h4>
              ${this._today == null ? html`<div class="muted">—</div>` : this._today.length ? this._today.map((e) => html`<div><b>${e.time}</b>${e.title.split(' · ')[0]}</div>`) : html`<div>No meetings</div>`}
              <div class="src">from the team calendar</div></div>
          </nav>
          <div class="list">
            ${this._err ? html`<div class="empty">${this._err}</div>` : shown.map((x) => html`<div class="th ${x.unread ? 'unread' : ''} ${x.id === this._sel ? 'on' : ''}" @click=${() => this._open(x)}>
              <div class="row"><span class="who">${[...new Set(x.messages.map((m) => m.from.name.split(' ')[0]))].join(', ')}${x.messages.length > 1 ? html` <span class="t">${x.messages.length}</span>` : nothing}</span><span class="t">${when(last(x).at)}</span></div>
              <div class="s">${x.subject}</div>
              <div class="p">${last(x).body.replace(/\s+/g, ' ')}</div></div>`)}
          </div>
          <div class="read">${t ? html`
            <h2>${t.subject}</h2>
            <div class="labels">${(t.labels || []).map((l) => html`<span class="badge">${l}</span>`)}${t.starred ? html`<span class="badge">starred</span>` : nothing}</div>
            ${t.messages.map((m) => html`<div class="msg">
              <div class="mh"><span class="av" title=${m.from.name}>${initials(m.from.name)}</span>
                <div><div class="n">${m.from.name}</div><div class="e">to ${toName(m.to)}</div></div>
                <span class="t">${new Date(m.at).toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit' })}</span></div>
              <div class="body">${m.body}</div></div>`)}
            ${this._replying ? html`<textarea placeholder="Write a reply…"></textarea>
              <div class="reply"><button class="send" @click=${() => this._send(t)}>Send</button><button @click=${() => { this._replying = false; }}>Discard</button></div>`
              : html`<div class="reply"><button @click=${() => { this._replying = true; }}>Reply</button></div>`}` : html`<div class="empty">Nothing selected</div>`}
          </div>`;
      }
    }
    // toName: a recipient as the page names them — a person's first name
    // (or full name), a team list as what it is; never the address itself
    function toName(addr) {
      const local = String(addr || '').split('@')[0];
      const lists = { team: 'everyone', hello: 'the team inbox', support: 'support', engineering: 'engineering' };
      if (lists[local]) return lists[local];
      return local.split(/[._-]+/).filter(Boolean).map((w) => w[0].toUpperCase() + w.slice(1)).join(' ') || 'the team';
    }
    customElements.define('team-inbox', TeamInbox);
  </script>
</body>
</html>
