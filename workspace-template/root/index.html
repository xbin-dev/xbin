<!doctype html>
<!--
  The workspace root — a thin page composing the shell. The layout itself is
  the `shell/` component in this workspace (open a terminal there to restyle
  everything live); theme tokens live in /vendor/theme.css and can be
  overridden in the <style> below.

  The <bx-frame> children below SEED the first screen the very first time a
  user opens the workspace:
      <bx-frame src="apps/thing"></bx-frame>
  After that, each user's layout is saved server-side (per user) and is the
  source of truth — they organise tiles into named "screens" (the tabs up
  top), open tiles from the sidebar, drag cards between columns, and close
  what they don't want. Editing this seed list only affects users who haven't
  opened the workspace yet.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xbin workspace</title>
  <link rel="stylesheet" href="/vendor/theme.css">
  <script type="module" src="/c/shell/bx-shell.js"></script>
  <style>
    body { margin: 0; }
    /* Override theme tokens here, e.g.:
       :root { --bx-accent: #7c3aed; } */
  </style>
</head>
<body class="bx">
  <bx-shell name="workspace">
    <bx-frame src="tiles/manager"></bx-frame>
    <bx-frame src="apps/welcome"></bx-frame>
    <bx-frame src="tiles/apidocs" height="520px"></bx-frame>
    <bx-frame src="tiles/admin" height="480px"></bx-frame>
  </bx-shell>
</body>
</html>
